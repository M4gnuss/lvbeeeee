/* ---------- persistance ---------- */
const KEY="espagnol_lvb_ecg2_v1";
let STORE_OK=true;
function load(){
  try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}
  catch(e){STORE_OK=false;return null;}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){STORE_OK=false;renderStorageWarning();}
}
let S=load()||{seances:{},anki:{},erreurs:[],lectures:[]};
SEANCES.forEach(s=>{ if(!S.seances[s.id]) S.seances[s.id]={answers:{},validated:false,startedAt:null,finishedAt:null}; });

/* ---------- utilitaires ---------- */
const TODAY=(function(){const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());})();
function norm(t){return (t||"").toLowerCase().trim().replace(/\s+/g," ").replace(/[.,;:!?¿¡"']/g,"");}
function noAcc(t){return norm(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function nb(id){const st=S.seances[id];return Object.keys(st.answers).length;}
function total(id){return SEANCES.find(s=>s.id===id).ex.length;}
function done(id,ex){const a=S.seances[id].answers[ex.id];if(!a)return false;
  if(a.needCorrectif&&!a.correctifDone)return false;
  if((ex.type==="theme"||ex.type==="libre")&&!a.selfEval)return false;
  return true;}
function nbDone(id){const s=SEANCES.find(x=>x.id===id);return s.ex.filter(e=>done(id,e)).length;}
function statut(s){
  const st=S.seances[s.id];
  if(st.validated) return {ic:"✅",txt:"FAITE",cls:"ok"};
  const n=nbDone(s.id);
  if(n>0) return {ic:"🟠",txt:"EN COURS — "+n+"/"+s.ex.length,cls:"warn"};
  if(s.date<TODAY) return {ic:"🔴",txt:"NON FAITE",cls:"ko"};
  return {ic:"⚪",txt:"NON COMMENCÉE",cls:""};
}
function addErreur(s,ex,val){
  S.erreurs.push({date:TODAY,seance:s.num,code:ex.code,qid:ex.id,
    original:val,correction:(ex.type==="qcm"?ex.options[ex.sol]:(Array.isArray(ex.sol)?ex.sol[0]:ex.sol)),
    regle:ex.regle,prompt:ex.prompt});
}
function erreursGroupees(){
  const g={};
  S.erreurs.forEach(e=>{const k=e.qid;g[k]=g[k]||{...e,n:0};g[k].n++;});
  const byCode={};
  Object.values(g).forEach(e=>{byCode[e.code]=byCode[e.code]||[];byCode[e.code].push(e);});
  return byCode;
}
function allAnki(){
  const out=[];
  SEANCES.forEach(s=>s.ex.forEach(e=>{if(e.anki)out.push({id:e.id,...e.anki,seance:s.num});}));
  return out;
}

let VIEW="today", CUR=null;
const TABS=[["today","AUJOURD'HUI"],["hist","MES SÉANCES"],["err","MES ERREURS"],["anki","ANKI"],["prog","MA PROGRESSION"]];
function nav(){
  document.getElementById("nav").innerHTML=TABS.map(t=>
    `<button class="${VIEW===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
}
function go(v){VIEW=v;CUR=null;render();window.scrollTo(0,0);}
function openSeance(id){CUR=id;VIEW="seance";
  if(!S.seances[id].startedAt){S.seances[id].startedAt=new Date().toISOString();save();}
  render();window.scrollTo(0,0);}

/* ---------- rendu ---------- */
function render(){nav();
  const m=document.getElementById("main");
  m.innerHTML = VIEW==="today"?vToday():VIEW==="hist"?vHist():VIEW==="err"?vErr():
                VIEW==="anki"?vAnki():VIEW==="prog"?vProg():vSeance();
  renderStorageWarning();
}
function renderStorageWarning(){
  if(STORE_OK)return;
  const m=document.getElementById("main");
  if(m.querySelector(".stwarn"))return;
  const d=document.createElement("div");
  d.className="fb warn stwarn";
  d.innerHTML="⚠️ <b>Sauvegarde automatique indisponible dans ce contexte.</b> Tes réponses ne survivront pas à un rechargement de la page. Ouvre le fichier <code>app.html</code> téléchargé directement dans ton navigateur pour activer la sauvegarde.";
  m.prepend(d);
}

  return `

    <div class="meta">${s.jour} · séance n°${s.num} · <b>20 minutes</b></div>

    </div>
  </div>
  ${retard.length?`<h2>À rattraper</h2>${retard.map(x=>{const t=statut(x);return `

  </div></div>`}).join("")}

  <h2>Comment fonctionne cette application</h2>
  <div class="card small">
    <p style="margin-top:0">Toutes les questions sont <b>obligatoires</b>. Impossible d'en sauter une : si tu ne sais pas, clique sur <i>Je ne sais pas</i> — cela compte comme une tentative et identifie une lacune.</p>
    <p>Il n'existe <b>aucun bouton « tout corriger »</b> : la correction n'apparaît qu'après ta réponse, question par question. Toute réponse fausse déclenche une <b>question corrective obligatoire</b>.</p>
    <p style="margin-bottom:0">Le bouton <b>✅ SÉANCE FAITE</b> reste verrouillé tant que les ${s.ex.length} exercices ne sont pas traités. Générer une séance ≠ l'avoir faite.</p>

function vErr(){
  const g=erreursGroupees();
  const codes=Object.keys(g);
  const recur=[];Object.values(g).forEach(a=>a.forEach(e=>{if(e.n>1)recur.push(e)}));
  if(!codes.length) return `<h2>Mes erreurs</h2>
    <div class="card"><p style="margin:0">Aucune erreur enregistrée pour l'instant.</p>
    <p class="meta" style="margin-bottom:0">Ce carnet se remplit <b>tout seul</b> à partir de tes réponses fausses. Il ne contient rien tant que tu n'as pas travaillé : c'est normal, et c'est voulu — il ne doit refléter que des erreurs réelles.</p></div>
    <div class="note">Codes utilisés : GRAM grammaire · CONJ conjugaison · LEX vocabulaire · SYN syntaxe · IDIO formulation · ACC accent · ORTH orthographe · CIV civilisation · METH méthode.</div>`;
  return `<h2>Mes erreurs</h2>
  ${recur.length?`<div class="fb ko"><b>⚠️ ERREUR RÉCURRENTE</b> — ${recur.length} point(s) manqué(s) plusieurs fois. À réactiver en priorité :<ul style="margin:6px 0 0">${recur.map(e=>`<li>${e.correction} <span class="tag">${e.code}</span></li>`).join("")}</ul></div>`:""}
  ${codes.map(c=>`<div class="card"><h3><span class="tag">${c}</span> ${g[c].length} point(s)</h3>
    <table><tr><th>Question</th><th>Ta réponse</th><th>Correction</th><th>×</th></tr>
    ${g[c].map(e=>`<tr><td>${e.prompt}</td><td style="color:var(--ko)">${e.original||"—"}</td>
      <td><b>${e.correction}</b></td><td>${e.n}</td></tr>`).join("")}</table></div>`).join("")}`;
}

  <textarea id="tsv" class="hide">${tsv}</textarea>

function vProg(){
  const faites=SEANCES.filter(s=>S.seances[s.id].validated).length;
  const gen=SEANCES.length;
  let just=0,tot=0;
  SEANCES.forEach(s=>s.ex.forEach(e=>{const a=S.seances[s.id].answers[e.id];
    if(!a)return; tot++;
    if(e.type==="theme"||e.type==="libre"){if(a.selfEval==="juste")just++;}
    else if(a.ok)just++;}));
  return `<h2>Ma progression</h2>
  <div class="card">
    <table>
      <tr><td>Séances générées</td><td><b>${gen}</b></td></tr>
      <tr><td>Séances validées ✅</td><td><b>${faites}</b></td></tr>
      <tr><td>Exercices traités</td><td><b>${tot}</b></td></tr>
      <tr><td>Réussite (auto-évaluation incluse)</td><td><b>${tot?Math.round(just/tot*100):0}%</b> (${just}/${tot})</td></tr>

}

    <div class="row"><div><b>${s.jour}</b><div class="meta">${s.titre} · 20 minutes</div></div>
    <button class="btn ghost small" onclick="go('today')">← Accueil</button></div>
    <div class="bar"><i style="width:${Math.round(n/N*100)}%"></i></div>
    <div class="meta">Progression ${n}/${N}${st.validated?" · ✅ SÉANCE FAITE":""}</div>
  </div>`;
  let etape="";
  s.ex.forEach((e,i)=>{
    const visible = st.validated || i<=idx || idx===-1;
    if(!visible) return;
    if(e.etape!==etape){etape=e.etape;h+=`<h2>${etape}</h2>`;}
    h+=exHtml(s,e,i);
  });
  if(idx===-1){
    h+=`<div class="card"><h3>${N} / ${N} exercices traités</h3>`;
    if(st.validated){
      h+=`<div class="fb ok"><b>✅ SÉANCE FAITE</b> — validée le ${st.finishedAt?st.finishedAt.slice(0,10):TODAY}.</div>`;
    }else{
      h+=`<p class="meta">Toutes les questions ont reçu une réponse et toutes les corrections ont été consultées.</p>
      <button class="btn" onclick="valider('${s.id}')">✅ SÉANCE FAITE</button>`;
    }
    h+=`</div>`+bilan(s)+immersion(s);
  }else{
    h+=`<div class="card tight"><button class="btn" disabled>✅ SÉANCE FAITE</button>
      <div class="fb ko" style="margin-top:8px">🔒 <b>SÉANCE NON TERMINÉE</b> — il reste ${N-n} exercice(s) à traiter avant de pouvoir valider.</div></div>`;
  }
  return h;
}

function exHtml(s,e,i){
  const a=S.seances[s.id].answers[e.id];
  let h=`<div class="card"><div class="meta">Question ${i+1} <span class="tag" style="margin-left:6px">${e.code}</span></div>
    <p style="margin:6px 0 4px"><b>${e.consigne}</b></p>
    <p class="es" style="margin:0 0 10px;font-size:17px">${e.prompt}</p>`;

  if(!a){ /* pas encore répondu */
    if(e.type==="qcm"){
      h+=e.options.map((o,k)=>`<label class="opt"><input type="radio" name="q${e.id}" value="${k}"> ${o}</label>`).join("");
      h+=`<button class="btn small" style="margin-top:8px" onclick="rep('${s.id}','${e.id}')">VALIDER</button>`;
    }else if(e.type==="theme"||e.type==="libre"){
      h+=`<textarea id="in_${e.id}" placeholder="Écris ta traduction / ton texte…"></textarea>
        <div style="margin-top:8px"><button class="btn small" onclick="rep('${s.id}','${e.id}')">VALIDER</button>
        <button class="btn ghost small" onclick="idk('${s.id}','${e.id}')">Je ne sais pas</button></div>`;
    }else{
      h+=`<input type="text" id="in_${e.id}" autocomplete="off" placeholder="Ta réponse…"
        onkeydown="if(event.key==='Enter')rep('${s.id}','${e.id}')">
        <div style="margin-top:8px"><button class="btn small" onclick="rep('${s.id}','${e.id}')">VALIDER</button>
        <button class="btn ghost small" onclick="idk('${s.id}','${e.id}')">Je ne sais pas</button></div>`;
    }
    h+=`<div class="kbd" style="margin-top:8px">Réponse obligatoire — impossible de passer à la suite sans avoir tenté.</div>`;
    return h+`</div>`;
  }

  /* déjà répondu : on montre la réponse + la correction */
  h+=`<div class="meta">Ta réponse :</div><p style="margin:2px 0 0" class="es">${a.value||"<i>(vide)</i>"}</p>`;
  if(e.type==="theme"||e.type==="libre"){
    h+=`<div class="fb ${a.selfEval==="juste"?"ok":a.selfEval==="revoir"?"ko":"warn"}">
      <div class="meta">${e.type==="libre"?"Modèle de niveau concours":"Corrigé"}</div>
      <p class="es" style="margin:4px 0 8px">${e.sol}</p>${e.regle}</div>`;
    if(!a.selfEval){
      h+=`<p class="meta" style="margin-bottom:4px">Compare honnêtement — l'auto-évaluation alimente ton carnet d'erreurs :</p>
      <button class="btn small" onclick="self('${s.id}','${e.id}','juste')">C'était juste</button>
      <button class="btn ghost small" onclick="self('${s.id}','${e.id}','presque')">Presque</button>
      <button class="btn ghost small" onclick="self('${s.id}','${e.id}','revoir')">À revoir</button>`;
    }else{
      h+=`<div class="meta">Auto-évaluation : <b>${a.selfEval}</b></div>`;
    }
  }else{
    if(a.ok){
      h+=`<div class="fb ok"><b>✅ CORRECT</b><br>${e.regle}</div>`;
    }else if(a.acc){
      h+=`<div class="fb warn"><b>⚠️ ACC — accent manquant ou fautif</b><br>Correction : <b class="es">${sol1(e)}</b><br>${e.regle}
      <br><span class="meta">Au concours, un accent manquant est une faute. Compté comme incorrect.</span></div>`;
    }else{
      h+=`<div class="fb ko"><b>❌ À REVOIR</b><br>Correction : <b class="es">${e.type==="qcm"?e.options[e.sol]:sol1(e)}</b><br>${e.regle}</div>`;
    }
    if(a.needCorrectif&&!a.correctifDone){
      h+=`<div style="margin-top:10px"><p class="meta" style="margin-bottom:4px">
        <b>Question corrective obligatoire</b> — écris toi-même la forme correcte pour débloquer la suite :</p>
        <input type="text" id="corr_${e.id}" autocomplete="off"
          onkeydown="if(event.key==='Enter')corr('${s.id}','${e.id}')">
        <button class="btn small" style="margin-top:6px" onclick="corr('${s.id}','${e.id}')">VALIDER</button></div>`;
    }else if(a.needCorrectif){
      h+=`<div class="meta" style="margin-top:8px">✔ Forme correcte réécrite.</div>`;
    }
  }
  return h+`</div>`;
}
function sol1(e){return Array.isArray(e.sol)?e.sol[0]:e.sol;}

function rep(sid,eid){
  const s=SEANCES.find(x=>x.id===sid), e=s.ex.find(x=>x.id===eid);
  let val, ok=null, acc=false;
  if(e.type==="qcm"){
    const c=document.querySelector(`input[name=q${eid}]:checked`);
    if(!c){alert("Choisis une réponse. Aucune question ne peut être sautée.");return;}
    val=e.options[+c.value];
    ok=(+c.value===e.sol); acc=false;
  }else{
    val=document.getElementById("in_"+eid).value;
    if(!norm(val)){alert("Réponse obligatoire. Si tu ne sais pas, clique sur « Je ne sais pas ».");return;}
    if(e.type==="theme"||e.type==="libre"){ok=null;acc=false;}
    else{
      const sols=e.sol.map(norm);
      ok=sols.includes(norm(val));
      acc=!ok&&e.sol.map(noAcc).includes(noAcc(val));
    }
  }
  S.seances[sid].answers[eid]={value:val,ok:ok===true,acc:acc,
    needCorrectif:(ok===false||acc===true),correctifDone:false,selfEval:null,at:new Date().toISOString()};
  if(ok===false||acc===true) addErreur(s,e,val);
  save();render();
}
function idk(sid,eid){
  const s=SEANCES.find(x=>x.id===sid), e=s.ex.find(x=>x.id===eid);
  S.seances[sid].answers[eid]={value:"JE NE SAIS PAS",ok:false,acc:false,
    needCorrectif:(e.type!=="theme"&&e.type!=="libre"),correctifDone:false,selfEval:null,at:new Date().toISOString()};
  addErreur(s,e,"JE NE SAIS PAS");
  save();render();
}
function corr(sid,eid){
  const e=SEANCES.find(x=>x.id===sid).ex.find(x=>x.id===eid);
  const v=document.getElementById("corr_"+eid).value;
  const good = e.type==="qcm" ? norm(v)===norm(e.options[e.sol]) : e.sol.map(norm).includes(norm(v));
  if(!good){alert("Ce n'est pas encore la forme exacte (accents compris). Recopie-la précisément : c'est ce geste qui fixe la correction.");return;}
  S.seances[sid].answers[eid].correctifDone=true;save();render();
}
function self(sid,eid,v){
  const s=SEANCES.find(x=>x.id===sid), e=s.ex.find(x=>x.id===eid);
  S.seances[sid].answers[eid].selfEval=v;
  if(v!=="juste") addErreur(s,e,S.seances[sid].answers[eid].value);
  save();render();
}
function valider(sid){
  const s=SEANCES.find(x=>x.id===sid);
  if(s.ex.some(e=>!done(sid,e))){alert("🔒 SÉANCE NON TERMINÉE.");return;}
  S.seances[sid].validated=true;S.seances[sid].finishedAt=new Date().toISOString();
  save();render();
}

function bilan(s){
  const wrong=s.ex.filter(e=>{const a=S.seances[s.id].answers[e.id];
    if(!a)return false;
    if(e.type==="theme"||e.type==="libre")return a.selfEval&&a.selfEval!=="juste";
    return a.ok===false||a.acc===true;});
  const codes=[...new Set(wrong.map(e=>e.code))];
  const retenir = s.retenir ? s.retenir : (s.id==="s1"
    ? ["<b>haber</b> impersonnel toujours au singulier : <i>hay, hubo, había</i>.",
       "Conditionnel dans la principale → <b>imparfait du subjonctif</b> dans la subordonnée.",
       "« devenir » → <b>convertirse en</b> ; « quitter le domicile familial » → <b>independizarse</b>."]
    : ["Radicaux d'indefinido en <b>-j</b> : <i>dijeron, trajeron, redujeron</i> — jamais de <i>-i-</i>.",
       "Après <b>si</b> hypothétique : imparfait du subjonctif, jamais de conditionnel.",
       "<b>desde hace + durée</b> se construit avec un <b>présent</b> en espagnol."]);
  return `<div class="card">
    <h3>À retenir aujourd'hui</h3><ul>${retenir.map(x=>`<li>${x}</li>`).join("")}</ul>
    <h3>Erreurs à réactiver</h3>
    ${wrong.length?`<ul>${wrong.slice(0,3).map(e=>`<li><span class="tag">${e.code}</span> ${sol1(e)}</li>`).join("")}</ul>
      <p class="meta">Ces points reviendront dans les prochaines séances (J+2, J+7, J+15). Codes concernés : ${codes.join(" · ")}.</p>`
     :`<p class="meta">Aucune erreur sur cette séance. Les notions seront tout de même réactivées une fois avant d'être considérées comme acquises.</p>`}
    <h3>Cartes Anki de la séance</h3>
    <ul>${s.ex.filter(e=>e.anki).map(e=>`<li><b>${e.anki.r}</b> → <span class="es">${e.anki.v}</span> <span class="tag">${e.anki.t}</span></li>`).join("")}</ul>
  </div>`;
}

function immersion(s){
  const i=s.immersion;
  return `<div class="card">
    <h3>${i.type} — 10 MINUTES D'ESPAGNOL RÉEL · ${i.pays}</h3>
    <p class="meta">Activité recommandée, hors des 20 minutes obligatoires : elle ne conditionne pas le statut « séance faite ».</p>
    <p><b>Sujet</b><br>${i.sujet}</p>
    <p><b>Pourquoi c'est utile</b><br>${i.pourquoi}</p>
    <p><b>3 mots à repérer</b></p><ul>${i.mots.map(m=>`<li class="es">${m}</li>`).join("")}</ul>
    <p><b>Question de compréhension</b> — réponds en espagnol, en 2 ou 3 phrases :<br>
    <span class="es">${i.question}</span></p>
    <p><a href="${i.url}" target="_blank" rel="noopener">Ouvrir l'article ↗</a><br>
    <span class="meta">${i.source}</span></p>
    <p class="meta">Renvoie-moi ta réponse dans la conversation : j'en tirerai 2 ou 3 expressions et des cartes Anki, réutilisées quelques jours plus tard.</p>
  </div>`;
}

render();
</script>
</body>
</html>
