   pourquoi:"Dossier d'essai idéal : il relie inflation, salaires, crédit, pauvreté et légitimité politique, à un an de la présidentielle argentine de 2027. Il permet de dépasser le slogan du « virage à droite » par de l'économie concrète.",
   mots:["la morosidad — les impayés, les défauts de paiement","el endeudamiento — l'endettement","el hartazgo — le ras-le-bol, l'exaspération"],
   question:"¿Por qué el Gobierno de Milei se niega a ayudar directamente a las familias endeudadas?",
   url:"https://www.infobae.com/economia/2026/08/15/mora-record-por-que-el-gobierno-rechaza-asistir-a-las-familias-endeudadas/",
   source:"Infobae, 15/08/2026 — chiffres du BCRA repris par la consultora 1816 ; propos de Luis Caputo recoupés avec Canal 26 (13/08/2026)"
 },
 ex:[
  {id:"s5r1",etape:"RÉACTIVATION",type:"saisie",code:"LEX",
   consigne:"Remplace le verbe passe-partout <i>hacer</i> par une expression précise (3 mots, à l'infinitif).",
   prompt:"El nuevo Gobierno quiere <b>hacer</b> una reforma laboral. → quiere ___ una reforma laboral.",
   sol:["llevar a cabo","poner en marcha"],regle:"<b>llevar a cabo</b> (ou <i>emprender, acometer, impulsar, poner en marcha</i>) una reforma. Réactivation J+2 du 14/08 : chaque fois que <i>hacer</i> te vient sous la plume, cherche le verbe exact — c'est un des reproches les plus constants des rapports ELVi."},
  {id:"s5r2",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Nominalisation — complète (un seul mot).",prompt:"Los precios han subido. → la ___ de los precios",
   sol:["subida"],regle:"<b>la subida</b> de los precios. Série à connaître par cœur : <i>subir → la subida</i> · <i>aumentar → el aumento</i> · <i>caer → la caída</i> · <i>crecer → el crecimiento</i> · <i>encarecerse → el encarecimiento</i>. (Réactivation J+2 du 14/08.)"},
  {id:"s5r3",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Reformule par le <i>se</i> de sens passif — conjugue le verbe (un seul mot).",
   prompt:"El presupuesto será presentado el 15 de septiembre. → Se ___ (presentar) el presupuesto el 15 de septiembre.",
   sol:["presentará"],regle:"Le <b>se de sens passif</b> remplace avantageusement la passive avec <i>ser</i>, et le verbe <b>s'accorde avec le sujet grammatical</b> : <i>se presentará el presupuesto</i> / <i>se presentarán las cuentas</i>. Attention à l'accent du futur : <b>presentará</b>. (Réactivation J+2 du 14/08.)"},
  {id:"s5r4",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Conjugue au temps et au mode qui conviennent.",
   prompt:"El Banco Central subió los tipos para que la inflación ___ (bajar).",
   sol:["bajara","bajase"],regle:"<b>para que</b> = but → <b>subjonctif</b> ; principale à l'indefinido (<i>subió</i>) → <b>imparfait du subjonctif</b> : <i>bajaron → bajara</i>. À opposer à <b>de modo que + indicatif</b> = conséquence réellement constatée (13/08). (Réactivation J+2 du 14/08.)"},
  {id:"s5r5",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Complète (un seul mot — ou écris <i>rien</i> si aucune préposition n'est nécessaire).",
   prompt:"El presidente nombró ___ un nuevo ministro de Economía.",
   sol:["a"],regle:"<b>a personnel</b> : le COD désignant une personne déterminée est précédé de <b>a</b> — <i>eligió <b>a</b> un presidente</i>, <i>nombró <b>a</b> un ministro</i>, <i>criticó <b>al</b> Gobierno</i>. On ne le met pas devant une chose : <i>nombró un comité</i>. (Réactivation du 11/08.)"},
  {id:"s5r6",etape:"RÉACTIVATION",type:"qcm",code:"CIV",
   consigne:"Civilisation — Amérique latine.",prompt:"Qui préside l'Argentine depuis le 10 décembre 2023 ?",
   options:["Sergio Massa","Javier Milei","Victoria Villarruel","Mauricio Macri"],sol:1,
   regle:"<b>Javier Milei</b> (<b>La Libertad Avanza</b>) a battu <b>Sergio Massa</b> (péronisme, <i>Unión por la Patria</i>) au second tour du <b>19 novembre 2023</b> avec environ <b>55,8 %</b> des voix, et a pris ses fonctions le <b>10 décembre 2023</b>. Sa vice-présidente est <b>Victoria Villarruel</b> ; son ministre de l'Économie, <b>Luis Caputo</b>. Prochaine présidentielle : <b>2027</b>.",
   anki:{r:"Président de l'Argentine depuis le 10/12/2023",v:"Javier Milei (La Libertad Avanza) — 55,8 % en la 2ª vuelta del 19/11/2023, frente a Sergio Massa",t:"CIV-AL"}},

  {id:"s5c1",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"SYN",
   consigne:"Complète la structure argumentative (2 mots).",
   prompt:"La crisis afecta no solo a los más pobres, ___ ___ a las clases medias.",
   sol:["sino también"],regle:"<b>no solo… sino también</b> — jamais <s>pero también</s>, calque du français très sanctionné. Si un verbe conjugué suit, on ajoute <i>que</i> : <i>no solo subieron los precios, <b>sino que</b> bajaron los salarios</i>."},
  {id:"s5c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"SYN",
   consigne:"<i>sino</i> ou <i>pero</i> ? (un seul mot)",
   prompt:"El malestar de los electores no es ideológico, ___ económico.",
   sol:["sino"],regle:"Après une <b>négation</b>, quand la seconde partie <b>rectifie</b> la première (« non pas A, mais B ») → <b>sino</b>. <b>pero</b> ajoute une restriction sans annuler : <i>es económico, <b>pero</b> también ideológico</i>. Test simple : si le français dit « mais bien », c'est <b>sino</b>.",
   anki:{r:"« non pas idéologique, mais économique »",v:"no es ideológico, SINO económico (pero = restriction, sino = rectification)",t:"GRAM"}},
  {id:"s5c3",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"GRAM",
   consigne:"Conjugue au mode qui convient (un seul mot).",
   prompt:"No cabe duda de que la economía ___ (ser) el principal desafío del Gobierno.",
   sol:["es"],regle:"Piège classique : la forme est négative, mais le sens est une <b>certitude</b> → <b>indicatif</b>. <i>No cabe duda de que <b>es</b>…</i> · <i>Es evidente que <b>es</b>…</i>. Le subjonctif reviendrait avec le doute : <i>Es dudoso que <b>sea</b>…</i> · <i>No creo que <b>sea</b>…</i> (11/08).",
   anki:{r:"No cabe duda de que la economía ___ (ser) el desafío.",v:"es — no cabe duda de que + INDICATIF (mais : es dudoso que sea)",t:"GRAM"}},
  {id:"s5c4",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Vocabulaire de l'essai — un seul mot (avec l'article).",
   prompt:"« le ras-le-bol », « l'exaspération » des électeurs se dit : ___",
   sol:["el hartazgo","hartazgo"],regle:"<b>el hartazgo</b> (de <i>estar harto de</i> = en avoir assez de). Série très rentable en essai : <i>el descontento</i> (le mécontentement), <i>el desencanto</i> (la désillusion), <i>el rechazo</i> (le rejet), <i>el malestar</i> (le malaise). Bien plus précis que <s>el problema</s> ou <s>la cosa</s>.",
   anki:{r:"le ras-le-bol / la désillusion / le mécontentement",v:"el hartazgo · el desencanto · el descontento",t:"LEX"}},
  {id:"s5c5",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"IDIO",
   consigne:"Concession — complète (2 mots).",
   prompt:"___ ___ que la economía explica mucho, pero no lo explica todo.",
   sol:["es cierto","si bien"],regle:"« Certes… mais » → <b>es cierto que… pero…</b> (ou <i>si bien es cierto que…</i>, <i>cierto es que…</i>). C'est la charnière qui permet de <b>nuancer sans se contredire</b> : elle vaut des points, à condition de la placer <b>après</b> avoir pris position, jamais avant."},

  {id:"s5t1",etape:"APPLICATION CONCOURS",type:"theme",code:"LEX",
   consigne:"Thème — traduis en espagnol.",
   prompt:"En juillet 2026, l'inflation argentine a de nouveau accéléré : elle a atteint 2,1 % sur un mois et 33,8 % sur un an.",
   sol:"En julio de 2026, la inflación argentina volvió a acelerarse: alcanzó el 2,1 % mensual y el 33,8 % interanual.",
   regle:"« de nouveau + verbe » se rend par <b>volver a + infinitif</b> (<i>volvió a subir, volvió a acelerarse</i>) — tournure très naturelle, à préférer à <i>otra vez</i>. « atteindre X % » → <b>alcanzar EL X %</b> (article obligatoire). « sur un an » → <b>interanual</b>. Mois clos → <b>indefinido</b>.",
   anki:{r:"« l'inflation a de nouveau accéléré »",v:"la inflación volvió a acelerarse (volver a + infinitivo)",t:"THEME"}},
  {id:"s5t2",etape:"APPLICATION CONCOURS",type:"theme",code:"GRAM",
   consigne:"Thème — traduis en espagnol.",
   prompt:"Bien que le gouvernement soit parvenu à faire baisser l'inflation, six millions d'Argentins n'ont plus accès au crédit.",
   sol:"Aunque el Gobierno ha conseguido reducir la inflación, seis millones de argentinos ya no tienen acceso al crédito.",
   regle:"<b>aunque + indicatif</b> quand le fait est <b>réel et admis</b> (le subjonctif en ferait une simple hypothèse). « parvenir à » → <b>conseguir / lograr + infinitif</b>. « ne… plus » → <b>ya no</b> (jamais <s>no más</s> en ce sens). <i>argentinos</i> sans majuscule : les gentilés s'écrivent en minuscule en espagnol."},
  {id:"s5t3",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Mini-essai — 100 à 120 mots.</b> Contraintes obligatoires : (1) réponds à la question <b>dès la première phrase</b> ; (2) prends position ; (3) deux exemples <b>datés et exacts</b> ; (4) une <b>nuance</b> introduite par <i>ahora bien</i> ou <i>es cierto que… pero</i> ; (5) pas d'introduction, pas de récitation de cours.",
   prompt:"¿El giro a la derecha en América Latina se explica sobre todo por el hartazgo económico de los electores?",
   sol:"El hartazgo económico explica en gran medida el giro a la derecha del continente, pero no basta para entenderlo. En Chile, José Antonio Kast ganó la segunda vuelta del 14 de diciembre de 2025 con cerca del 58 % de los votos porque la izquierda no logró contener ni la inflación ni la delincuencia. En Argentina, la inflación interanual seguía en el 33,8 % en julio de 2026 y seis millones de personas han quedado fuera del crédito: el voto castiga sobre todo la pérdida de nivel de vida. Ahora bien, conviene matizar: México mantuvo a la izquierda en el poder con Claudia Sheinbaum en 2024. No existe, pues, una ola ideológica, sino un castigo a los gobiernos que fracasan.",
   regle:"Ce qui vaut la note : la <b>réponse tient dans la première phrase</b> (« explique en grande partie, mais ne suffit pas ») ; chaque exemple est <b>daté, chiffré et au service de l'argument</b>, jamais plaqué ; la nuance arrive <b>après</b> la prise de position et repose sur un <b>contre-exemple</b>, pas sur une formule creuse ; la conclusion <b>reformule la thèse</b> (<i>no… sino…</i>) au lieu de résumer les documents. Longueur maîtrisée, phrases sûres : c'est exactement le profil d'une copie à 15-17."}
 ]
},
{
 id:"s6", num:6, date:"2026-08-18", jour:"mardi 18 août 2026",
 titre:"Thème suivi — traduire un paragraphe de presse",
 themes:"thème suivi · frente a · seguir + gérondif · indefinido/imparfait · incendies en Espagne",
 retenir:[
   "Thème chiffré : « contre X » dans une comparaison → <b>frente a</b> (+ article : <i>frente a las 295.580</i>). Les milliers s'écrivent avec un <b>point</b> en espagnol (<i>254.730</i>), les décimales avec une <b>virgule</b> (<i>2,1 %</i>). Devant un nombre : <b>más de / menos de</b>, jamais <s>más que</s>.",
   "« rester / continuer d'être » → <b>seguir + gérondif</b> (<i>las temperaturas siguen siendo elevadas</i>), jamais <s>continuar a</s>. Dans un récit : <b>indefinido</b> pour le fait daté (<i>se declaró el 10 de julio</i>), <b>imparfait</b> pour la circonstance (<i>cuando atravesaba una ola de calor</i>).",
   "Espagne 2026 : <b>254.730 hectares</b> brûlés au <b>17 août</b> (MITECO), <b>42</b> grands incendies, contre <b>295.580 ha</b> et 55 grands incendies en 2025 — première baisse de l'été. L'<b>extinction relève des communautés autonomes</b> ; l'État appuie via l'<b>UME</b> (créée en 2005)."
 ],

   pourquoi:"Dossier très polyvalent : environnement et changement climatique, <i>España vaciada</i> et déprise rurale, répartition des compétences entre l'État et les communautés autonomes, dépense publique de prévention.",
   mots:["arder · la superficie quemada — brûler · la surface brûlée","el siniestro — le sinistre","la prevención vs la extinción — la prévention / l'extinction"],
   question:"¿Por qué el Miteco insiste en mantener la vigilancia a pesar de la mejora de las cifras?",
   url:"https://www.infobae.com/espana/agencias/2026/08/18/las-hectareas-afectadas-por-incendios-alcanzan-las-254730-en-lo-que-va-de-ano-en-espana/",
   source:"Infobae España / Agencia EFE, 18/08/2026 — données du MITECO. Chiffres recoupés avec El Debate (18/08/2026) et The Objective (18/08/2026)."

 ex:[
  {id:"s6r1",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Complète (2 mots).",
   prompt:"El fuego no solo destruyó viviendas, ___ ___ obligó a evacuar a más de mil personas.",
   sol:["sino que"],
   regle:"<b>no solo… sino también</b> devant un <b>nom</b> ou un groupe ; <b>no solo… sino que</b> devant un <b>verbe conjugué</b>. Jamais <s>pero también</s> (calque du français, lourdement sanctionné). Réactivation du 17/08."},
  {id:"s6r2",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"<i>sino</i> ou <i>pero</i> ? (un seul mot)",
   prompt:"Este año la superficie quemada no ha aumentado, ___ ha disminuido.",
   sol:["sino que","sino"],
   regle:"Après une <b>négation</b>, quand la seconde partie <b>rectifie</b> la première (« non pas A, mais B ») → <b>sino</b> ; devant un <b>verbe conjugué</b>, <b>sino que</b>. <b>pero</b> ajoute une restriction sans annuler : <i>ha disminuido, <b>pero</b> sigue siendo mucho</i>. Réactivation du 17/08."},
  {id:"s6r3",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Conjugue au mode qui convient (un seul mot).",
   prompt:"No cabe duda de que el cambio climático ___ (agravar) el riesgo de incendios.",
   sol:["agrava"],
   regle:"Piège : la tournure est <b>négative</b> mais le sens est une <b>certitude</b> → <b>indicatif</b>. <i>No cabe duda de que <b>agrava</b>…</i> · <i>Es evidente que <b>agrava</b>…</i>. Le subjonctif revient avec le doute ou l'opinion niée : <i>No creo que <b>agrave</b>…</i>. Réactivation du 17/08."},
  {id:"s6r4",etape:"RÉACTIVATION",type:"theme",code:"GRAM",
   consigne:"Thème court — traduis en espagnol.",
   prompt:"L'été dernier, les flammes ont de nouveau menacé des villages entiers, mais cette année la surface brûlée n'augmente plus.",
   sol:"El verano pasado, las llamas volvieron a amenazar pueblos enteros, pero este año la superficie quemada ya no aumenta.",
   regle:"« de nouveau + verbe » → <b>volver a + infinitif</b> (<i>volvieron a amenazar</i>), bien plus naturel que <i>otra vez</i>. « ne… plus » → <b>ya no</b> (jamais <s>no más</s> en ce sens). Été clos et daté → <b>indefinido</b>. « village » → <b>el pueblo</b> ; <i>la aldea</i> est un hameau. Réactivation du 17/08."},
  {id:"s6r5",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Conjugue (un seul mot).",
   prompt:"Si el Estado ___ (invertir) más en prevención, habría menos grandes incendios.",
   sol:["invirtiera","invirtiese"],
   regle:"<b>si + imparfait du subjonctif → conditionnel</b> dans la principale. Jamais <s>si invertiría</s>. Formation : 3<sup>e</sup> pers. plur. de l'indefinido <i>invirtieron</i> → <b>invirtiera / invirtiese</b> — attention à la <b>diphtongue e→i</b> (<s>invertiera</s> est un barbarisme). Réactivation du 12/08 (J+6)."},
  {id:"s6r6",etape:"RÉACTIVATION",type:"saisie",code:"ACC",
   consigne:"Recopie ces trois mots <b>avec leurs accents écrits</b> (séparés par des virgules).",
   prompt:"la prevencion · la extincion · las hectareas",
   sol:["la prevención, la extinción, las hectáreas"],
   regle:"Les noms en <b>-ción</b> portent tous l'accent au singulier (<i>la prevención, la extinción, la inflación</i>) et le <b>perdent</b> au pluriel (<i>las prevenciones</i>). <b>hectárea</b> est un <i>esdrújula</i> : accent obligatoire au singulier comme au pluriel. Un accent oublié est compté comme une faute par le jury. Réactivation des 11 et 13/08."},

  {id:"s6c1",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Vocabulaire — un seul verbe, à l'infinitif.",
   prompt:"« ravager, dévaster » (le feu a ___ des milliers d'hectares) : ___",
   sol:["arrasar"],
   regle:"<b>arrasar</b> (ravager) · <b>calcinar</b> (réduire en cendres) · <b>devastar</b>. Le verbe simple « brûler » est <b>arder</b> (intransitif : <i>ardieron 254.730 hectáreas</i>) ou <b>quemarse</b>. Éviter le <s>destruir</s> passe-partout : le jury attend un lexique précis.",
   anki:{r:"ravager / réduire en cendres (un incendie)",v:"arrasar · calcinar · devastar (brûler = arder / quemarse)",t:"LEX"}},
  {id:"s6c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"GRAM",
   consigne:"Complète (2 mots).",
   prompt:"Las temperaturas ___ ___ (seguir + ser) elevadas esta semana.",
   sol:["siguen siendo"],
   regle:"« rester / continuer d'être » → <b>seguir + gérondif</b> : <i>siguen siendo elevadas</i>. Jamais <s>continuar a ser</s> ni <s>quedan elevadas</s>. Attention à la diphtongue de <i>seguir</i> (e→i) : <i>sigo, sigues, sigue, seguimos, seguís, <b>siguen</b></i>. Même construction pour « continuer à baisser » → <b>seguir bajando</b>.",
   anki:{r:"« les températures restent élevées »",v:"las temperaturas siguen siendo elevadas (seguir + gerundio)",t:"GRAM"}},
  {id:"s6c3",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"SYN",
   consigne:"Complète (2 mots).",
   prompt:"Han ardido 254.730 hectáreas, ___ ___ las 295.580 del año pasado.",
   sol:["frente a"],
   regle:"« contre X » dans une <b>comparaison chiffrée</b> → <b>frente a</b> (ou <i>en comparación con</i>). Jamais <s>contra</s>, qui exprime l'opposition ou la lutte (<i>la lucha contra el fuego</i>). Noter l'<b>article devant le chiffre repris</b> : <i>frente a <b>las</b> 295.580</i>. Structure de thème extrêmement rentable.",
   anki:{r:"« 254.730 hectares, contre 295.580 l'an dernier »",v:"254.730 hectáreas, frente a las 295.580 del año pasado",t:"THEME"}},
  {id:"s6c4",etape:"TRAVAIL CIBLÉ",type:"qcm",code:"GRAM",
   consigne:"Choisis la seule traduction correcte.",
   prompt:"« plus de 6.000 sinistres »",
   options:["más que 6.000 siniestros","más de 6.000 de siniestros","más de 6.000 siniestros","mas de 6.000 siniestros"],
   sol:2,
   regle:"Devant un <b>nombre</b> : <b>más de / menos de</b>. <i>más que</i> compare deux éléments (<i>trabaja más que yo</i>). Pas de <i>de</i> après le chiffre (<s>más de 6.000 de siniestros</s>). Et <b>más</b> porte un <b>accent</b> quand il signifie « plus » : <i>mas</i> sans accent est un synonyme littéraire de <i>pero</i>."},
  {id:"s6c5",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"CONJ",
   consigne:"Conjugue (un seul mot).",
   prompt:"El incendio se declaró el 10 de julio, cuando la región ___ (atravesar) una ola de calor.",
   sol:["atravesaba"],
   regle:"Deux temps du passé, deux rôles : <b>indefinido</b> pour le fait <b>ponctuel et daté</b> (<i>se declaró el 10 de julio</i>), <b>imparfait</b> pour la <b>circonstance en cours</b> qui sert de décor (<i>atravesaba una ola de calor</i>). Erreur très fréquente en thème : tout mettre à l'indefinido, ce qui écrase le récit. Repère : « était en train de » → imparfait.",
   },

  {id:"s6t1",etape:"APPLICATION CONCOURS",type:"theme",code:"METH",
   consigne:"<b>Thème suivi — traduis le paragraphe entier, en un seul bloc.</b> Ne traduis pas phrase à phrase : relis-toi à la fin pour vérifier les accords, les accents et l'écriture des nombres.",
   prompt:"Selon le ministère de la Transition écologique, 254.730 hectares ont brûlé en Espagne entre le 1<sup>er</sup> janvier et le 17 août 2026, contre 295.580 à la même date l'an dernier. C'est la première fois cet été que le bilan reste inférieur à celui de 2025. Le pays a néanmoins recensé 42 grands incendies de plus de 500 hectares, et le gouvernement a déclaré 211 zones sinistrées dans quatorze communautés autonomes. Les autorités appellent à la prudence : les températures restent élevées et la saison n'est pas terminée.",
   sol:"Según el Ministerio para la Transición Ecológica, ardieron 254.730 hectáreas en España entre el 1 de enero y el 17 de agosto de 2026, frente a las 295.580 de la misma fecha del año pasado. Es la primera vez este verano que el balance se sitúa por debajo del de 2025. Sin embargo, el país registró 42 grandes incendios de más de 500 hectáreas, y el Gobierno declaró 211 zonas afectadas en catorce comunidades autónomas. Las autoridades piden prudencia: las temperaturas siguen siendo elevadas y la campaña no ha terminado.",
   regle:"Points de contrôle, un par un : <b>1.</b> « ont brûlé » → <b>ardieron</b> (ou <i>se quemaron</i>) : <i>arder</i> est intransitif, ce sont les hectares qui brûlent. <b>2.</b> Nombres : point pour les milliers (<b>254.730</b>), virgule pour les décimales — l'inverse du français. <b>3.</b> Dates : <b>el 1 de enero</b>, <b>el 17 de agosto de 2026</b> (jamais <s>el 1<sup>er</sup></s>, jamais <s>en 2026</s> après le mois). <b>4.</b> « contre » chiffré → <b>frente a las 295.580</b>. <b>5.</b> « néanmoins » → <b>sin embargo</b> (<i>no obstante</i> possible) ; <s>sin embargo de</s> n'existe pas. <b>6.</b> <b>el Gobierno</b> prend une majuscule quand il désigne l'exécutif ; <b>comunidades autónomas</b> reste en minuscules. <b>7.</b> « appeler à la prudence » → <b>pedir prudencia</b> (attention : <i>pedir <b>que</b> + subjonctif</i> s'il y a une complétive : <i>piden que se extreme la precaución</i>). <b>8.</b> Les deux-points espagnols ne prennent <b>pas</b> d'espace avant : <i>prudencia:</i>, pas <s>prudencia :</s>.",
   anki:{r:"Incendies en Espagne — chiffre daté à réutiliser",v:"254.730 ha quemadas hasta el 17/08/2026 (Miteco), 42 grandes incendios, frente a 295.580 ha en 2025",t:"CIV-ESPAGNE"}},
  {id:"s6t2",etape:"APPLICATION CONCOURS",type:"qcm",code:"CIV",
   consigne:"Civilisation — Espagne. Une seule réponse.",
   prompt:"En Espagne, qui est juridiquement compétent pour l'extinction des incendies de forêt ?",
   options:["L'État central, par l'intermédiaire du ministère de l'Intérieur","Les <i>comunidades autónomas</i>, l'État n'intervenant qu'en appui","Les mairies (<i>ayuntamientos</i>) seules","L'Union européenne, via le mécanisme de protection civile"],
   sol:1,
   regle:"L'extinction — comme la prévention — est une <b>compétence transférée aux communautés autonomes</b> : c'est une conséquence directe de l'<b>État des autonomies</b> issu de la <b>Constitution de 1978</b> (art. 148-149). L'État central n'intervient qu'en <b>appui</b> : l'<b>UME</b> (<i>Unidad Militar de Emergencias</i>, créée en <b>2005</b>, environ <b>3.500</b> militaires), les moyens aériens du MITECO, et la déclaration en Conseil des ministres de <b>zona afectada gravemente por una emergencia de protección civil</b> — <b>211 zones dans 14 communautés</b> le <b>28 juillet 2026</b>. D'où le débat récurrent : des moyens de prévention <b>très inégaux d'une région à l'autre</b>. Argument réutilisable sur la décentralisation, l'environnement ou l'efficacité de l'État.",
   anki:{r:"Qui est compétent pour éteindre les incendies en Espagne ?",v:"Las comunidades autónomas (competencia transferida, Constitución de 1978) ; el Estado apoya con la UME (creada en 2005, ~3.500 militares)",t:"CIV-ESPAGNE"}},
  {id:"s6t3",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Écris UNE SEULE phrase</b> (25 à 35 mots), réutilisable telle quelle dans un essai. Contraintes obligatoires : (1) un <b>chiffre daté</b> tiré de la séance ; (2) la structure <b>frente a</b> <u>ou</u> <b>no solo… sino también</b> ; (3) la phrase doit se terminer par une <b>interprétation</b>, pas par la donnée.",
   prompt:"Los incendios forestales en España: ¿un problema climático o un problema de gestión del territorio?",
   sol:"Con 254.730 hectáreas quemadas hasta el 17 de agosto de 2026, frente a las 295.580 del año anterior, España demuestra que el fuego no depende solo del clima, sino también de una prevención que sigue siendo una competencia desigual de las comunidades autónomas.",
   regle:"Ce qui distingue un bon exemple d'un chiffre plaqué : le chiffre est <b>daté et sourcé</b> ; la comparaison (<i>frente a</i>) lui donne un <b>sens</b> au lieu de le laisser isolé ; et la phrase <b>se termine par l'interprétation</b> — ici la prévention comme compétence autonomique inégale. C'est le schéma attendu par le jury : <b>IDÉE → CHIFFRE DATÉ → INTERPRÉTATION</b>. Un chiffre qui clôt une phrase ne prouve rien ; un chiffre qui ouvre sur une idée vaut des points."}
 ]
},
{
 id:"s7", num:7, date:"2026-08-19", jour:"mercredi 19 août 2026",
 titre:"Résumé analytique comparatif — confronter deux documents",
 themes:"résumé comparatif · attribuer une thèse · connecteurs d'opposition · reformulation · Mexique / Pérou",
 retenir:[
   "Un résumé comparatif ne traite <b>jamais</b> « document 1 puis document 2 » : on annonce le point commun, puis on oppose. Charnières indispensables : <b>mientras que</b> · <b>en cambio</b> · <b>por su parte</b> · <b>frente a</b> · <b>ahora bien</b>.",
   "Attribuer une thèse sans recopier : <b>el autor sostiene / afirma / señala / denuncia / matiza que</b> + <b>indicatif</b> ; mais <b>no considera que</b> · <b>no cree que</b> + <b>subjonctif</b> (<i>no considera que las remesas <b>sean</b> una solución</i>).",
   "Mexique : <b>30.759 millions de dollars</b> de <i>remesas</i> au 1<sup>er</sup> semestre 2026 (<b>+3,1 %</b>, Banxico), soit près de <b>4 % du PIB</b>, malgré la taxe américaine de <b>1 %</b> entrée en vigueur le <b>1<sup>er</sup> janvier 2026</b>. Pérou : <b>Keiko Fujimori</b> (Fuerza Popular) présidente depuis le <b>28 juillet 2026</b>."
 ],

 },
 ex:[
  {id:"s7r1",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Complète (2 mots).",
   prompt:"México recibió 30.759 millones de dólares, ___ ___ los 29.842 del año anterior.",
   sol:["frente a"],
   regle:"Comparaison chiffrée → <b>frente a</b> (ou <i>en comparación con</i>), jamais <s>contra</s>. Ne pas oublier l'<b>article devant le chiffre repris</b> : <i>frente a <b>los</b> 29.842</i>. Réactivation J+1 du 18/08."},
  {id:"s7r2",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Complète (2 mots).",
   prompt:"Las remesas ___ ___ (seguir + crecer), pero a un ritmo más lento.",
   sol:["siguen creciendo"],
   regle:"« continuer à + infinitif » → <b>seguir + gérondif</b> : <i>siguen creciendo</i>. Jamais <s>continuar a crecer</s>. Attention à la diphtongue e→i de <i>seguir</i> : <i>sigue, <b>siguen</b></i>. Réactivation J+1 du 18/08."},
  {id:"s7r3",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Conjugue (un seul mot).",
   prompt:"El impuesto entró en vigor el 1 de enero de 2026, cuando el número de envíos ya ___ (bajar).",
   sol:["bajaba"],
   regle:"<b>Indefinido</b> pour le fait ponctuel et daté (<i>entró en vigor el 1 de enero</i>), <b>imparfait</b> pour la circonstance en cours qui sert de décor (<i>ya bajaba</i>). Tout mettre à l'indefinido écrase le récit : c'est une des fautes les plus fréquentes en thème. Réactivation J+1 du 18/08."},
  {id:"s7r4",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Complète par la préposition qui convient (un seul mot).",
   prompt:"Muchos hogares se quejan ___ la pérdida de poder adquisitivo.",
   sol:["de"],
   regle:"<b>quejarse DE algo</b>. Même série, à mémoriser <b>avec</b> le verbe : <i>depender de</i>, <i>darse cuenta de</i>, <i>acordarse de</i>, <i>convertirse en</i>, <i>coincidir en</i>. Réactivation J+8 du 11/08 : ce point n'avait encore jamais été revu."},
  {id:"s7r5",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Complète (un seul mot).",
   prompt:"___ años que este debate divide a los economistas mexicanos.",
   sol:["hace"],
   regle:"Action commencée dans le passé et <b>toujours en cours</b> : <b>hace + durée + que + présent</b> (<i>hace años que divide</i>). Variante : <i>divide a los economistas <b>desde hace</b> años</i>. Jamais de passé composé comme en français. Réactivation J+8 du 11/08."},
  {id:"s7r6",etape:"RÉACTIVATION",type:"qcm",code:"CIV",
   consigne:"Civilisation — Mexique.",
   prompt:"¿Con qué partido llegó Claudia Sheinbaum a la presidencia de México?",
   options:["el PRI","el PAN","Morena","Movimiento Ciudadano"],
   sol:2,
   regle:"<b>Morena</b> (<i>Movimiento Regeneración Nacional</i>), le parti fondé par <b>Andrés Manuel López Obrador</b>. Claudia Sheinbaum, investie le <b>1<sup>er</sup> octobre 2024</b>, est la <b>première femme présidente du Mexique</b>. Repères utiles : le <b>PRI</b> a gouverné sans interruption de 1929 à 2000 ; le <b>PAN</b> est le grand parti de droite ; <b>Movimiento Ciudadano</b>, une formation centriste plus récente. Réactivation J+7 du 12/08."},

  {id:"s7c1",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Attribuer une thèse — un seul verbe, à la 3<sup>e</sup> personne du singulier.",
   prompt:"« l'auteur soutient que… » → el autor ___ que…",
   sol:["sostiene","afirma","defiende"],
   regle:"<b>sostener que</b> (diphtongue o→ue : <i>sostiene</i>), <b>afirmar</b>, <b>defender</b> + <b>indicatif</b>. Élargis la palette selon la nuance : <i>señalar</i> (souligner), <i>subrayar</i> (insister), <i>denunciar</i> (dénoncer), <i>lamentar</i> (déplorer), <i>matizar</i> (nuancer), <i>recordar</i> (rappeler). Écrire <i>dice que</i> partout est le signe d'un résumé pauvre.",
   anki:{r:"l'auteur soutient / souligne / dénonce / nuance",v:"el autor sostiene · señala · denuncia · matiza (que + indicativo)",t:"LEX"}},
  {id:"s7c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"SYN",
   consigne:"Connecteur d'opposition — complète (2 mots).",
   prompt:"El primer texto se limita a informar, ___ ___ el segundo toma partido.",
   sol:["mientras que"],
   regle:"Opposition entre deux documents → <b>mientras que</b>. <i>Mientras</i> seul est <b>temporel</b> (« pendant que ») : <i>mientras hablaba…</i>. Autres charnières de confrontation : <b>en cambio</b>, <b>por su parte</b>, <b>frente a</b>, <b>sin embargo</b>, <b>ahora bien</b>. Ce sont elles qui transforment deux résumés juxtaposés en une véritable comparaison.",
   anki:{r:"« tandis que » (opposition entre deux documents)",v:"mientras que (mientras solo = temporal) · en cambio · por su parte",t:"GRAM"}},
  {id:"s7c3",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"GRAM",
   consigne:"Conjugue au mode qui convient (un seul mot).",
   prompt:"El segundo documento no considera que las remesas ___ (ser) una solución duradera.",
   sol:["sean"],
   regle:"Verbe d'opinion <b>nié</b> → <b>subjonctif</b> : <i>no considera que <b>sean</b></i>, <i>no cree que <b>sea</b></i>, <i>no piensa que <b>tengan</b> razón</i>. À la forme affirmative, l'indicatif revient : <i>considera que <b>son</b></i>. Piège inverse déjà vu le 17/08 : <i>no cabe duda de que</i> + <b>indicatif</b>, parce que le sens est une certitude. Réactivation du 11/08."},
  {id:"s7c4",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"SYN",
   consigne:"Complète par la préposition qui convient (un seul mot).",
   prompt:"Ambos autores coinciden ___ señalar la fragilidad del modelo.",
   sol:["en"],
   regle:"<b>coincidir EN algo / en + infinitif</b> (= se rejoindre sur un point). Son contraire : <b>discrepar DE alguien</b>, <i>discrepar en un punto</i>. Voisins utiles au résumé : <i>estar de acuerdo <b>con</b> alguien <b>en</b> algo</i>, <i>oponerse <b>a</b></i>, <i>diferir <b>de</b></i>.",
   anki:{r:"se rejoindre sur un point / diverger",v:"coincidir EN algo · discrepar DE alguien · oponerse A algo",t:"LEX"}},
  {id:"s7c5",etape:"TRAVAIL CIBLÉ",type:"qcm",code:"METH",
   consigne:"Une seule de ces phrases est une <b>véritable reformulation</b> de la phrase d'origine.",
   prompt:"Phrase d'origine : <i>« Las remesas alivian la pobreza sin corregir sus causas. »</i>",
   options:["Las remesas alivian la pobreza pero no corrigen sus causas.","Este dinero mejora las condiciones de vida inmediatas sin actuar sobre los mecanismos que generan la desigualdad.","Las remesas no corrigen las causas de la pobreza, aunque la alivian.","Las remesas son un problema grave para México."],
   sol:1,
   regle:"La bonne réponse <b>change le lexique, la structure et le niveau d'abstraction</b> tout en conservant exactement le sens. Les propositions 1 et 3 se contentent de déplacer les mots d'origine : c'est de la <b>paraphrase</b>, la faute la plus constamment sanctionnée par les rapports ELVi. La proposition 4 déforme le texte : l'auteur ne dit pas que les <i>remesas</i> sont un problème, mais qu'elles ne suffisent pas. Test à s'appliquer : si l'on peut suivre l'original mot à mot, ce n'est pas une reformulation."},

  {id:"s7t1",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"Lis d'abord les deux documents ci-dessous — ils serviront à tout le reste de la séance. Puis <b>reformule en UNE seule phrase espagnole</b> la phrase signalée du document 1, sans reprendre plus de <b>deux mots</b> de l'original (chiffres et noms propres non comptés).",
   prompt:"<b>DOCUMENTO 1</b> — nota de agencia, 3 de agosto de 2026 (adaptado)<br>« Las remesas enviadas a México alcanzaron 30.759 millones de dólares en el primer semestre de 2026, un 3,1 % más que en el mismo periodo de 2025, según el Banco de México. El envío medio subió a 405 dólares y el 99,2 % de las transferencias se realizó por vía electrónica. El repunte se produce pese al impuesto del 1 % que Estados Unidos aplica desde el 1 de enero de 2026 a las remesas enviadas en efectivo. Las remesas equivalen a cerca del 4 % del PIB mexicano y México es el segundo receptor mundial, por detrás de la India. »<br><br><b>DOCUMENTO 2</b> — texto de opinión<br>« Cada trimestre celebramos las cifras de las remesas como si fueran una buena noticia. Conviene invertir la mirada: ningún país debería depender del dinero que envían quienes tuvieron que marcharse. Las remesas sostienen el consumo de millones de hogares, pero no crean empleo cualificado ni infraestructuras; alivian la pobreza sin corregir sus causas. Además, atan la economía nacional a las decisiones políticas de otro país: basta un impuesto o un endurecimiento migratorio para que el ingreso de miles de familias se reduzca. Mientras no se generen oportunidades dentro del país, seguiremos exportando trabajadores e importando dólares. »<br><br><b>Phrase à reformuler (document 1) :</b><br><i>« Las remesas enviadas a México alcanzaron 30.759 millones de dólares en el primer semestre de 2026, un 3,1 % más que en el mismo periodo de 2025. »</i>",
   sol:"En los seis primeros meses de 2026, el dinero que los emigrantes mandaron a sus familias superó los 30.700 millones de dólares, un 3,1 % más que un año antes.",
   regle:"Trois gestes, toujours les mêmes : <b>1.</b> changer le <b>point de vue</b> (<i>las remesas alcanzaron</i> → <i>el dinero que los emigrantes mandaron</i>) ; <b>2.</b> changer la <b>structure</b> (<i>en el primer semestre de 2026</i> → <i>en los seis primeros meses de 2026</i>) ; <b>3.</b> <b>synthétiser</b> le détail (<i>30.759</i> → <i>superó los 30.700</i>) sans jamais fausser le chiffre. Ce qui reste interdit : recopier <i>alcanzaron</i>, <i>en el mismo periodo</i> ou <i>según el Banco de México</i>. <br>Note sur les sources : le document 1 reprend des données publiées par le <b>Banco de México</b> le 3 août 2026 (reprises par Forbes México et El Financiero) ; le document 2 a été <b>rédigé pour cet exercice</b>, dans l'esprit du débat récurrent de la presse mexicaine — ce n'est pas la citation d'un éditorial existant.",
   anki:{r:"les transferts d'argent des émigrés (Mexique)",v:"las remesas — 30.759 M$ en el 1.er semestre de 2026 (+3,1 %, Banxico), cerca del 4 % del PIB",t:"CIV-MEXIQUE"}},
  {id:"s7t2",etape:"APPLICATION CONCOURS",type:"qcm",code:"CIV",
   consigne:"Civilisation — Amérique latine. Une seule réponse.",
   prompt:"¿Quién preside el Perú desde el 28 de julio de 2026?",
   options:["Dina Boluarte","Roberto Sánchez","Keiko Fujimori","Pedro Castillo"],
   sol:2,
   regle:"<b>Keiko Fujimori</b> (<b>Fuerza Popular</b>, droite), fille de l'ancien président <b>Alberto Fujimori</b> (1990-2000), a remporté au <b>second tour du 7 juin 2026</b>, d'une marge minime et au terme d'un dépouillement très serré, face à <b>Roberto Sánchez</b> (<i>Juntos por el Perú</i>, gauche). Elle a pris ses fonctions le <b>28 juillet 2026</b>, jour des <i>Fiestas Patrias</i>, pour un mandat de <b>cinq ans</b>. C'était sa <b>quatrième</b> tentative présidentielle. <b>Dina Boluarte</b> (2022-2025) avait accédé au pouvoir comme vice-présidente, sans avoir été élue à la présidence ; <b>Pedro Castillo</b> a été destitué en décembre 2022. À retenir surtout : l'<b>instabilité politique</b> péruvienne, avec une succession de chefs d'État depuis 2016.",
   anki:{r:"Présidente du Pérou depuis le 28 juillet 2026",v:"Keiko Fujimori (Fuerza Popular) — 2ª vuelta del 07/06/2026 frente a Roberto Sánchez; mandato de cinco años",t:"CIV-AL"}},
  {id:"s7t3",etape:"APPLICATION CONCOURS",type:"theme",code:"LEX",
   consigne:"Thème — traduis en espagnol.",
   prompt:"Depuis l'entrée en vigueur de la taxe américaine, en janvier 2026, de nombreuses familles mexicaines se plaignent d'avoir perdu du pouvoir d'achat, car les produits de base ont renchéri.",
   sol:"Desde la entrada en vigor del impuesto estadounidense, en enero de 2026, muchas familias mexicanas se quejan de haber perdido poder adquisitivo, porque los productos básicos se han encarecido.",
   regle:"Points de contrôle : <b>1.</b> « l'entrée en vigueur » → <b>la entrada en vigor</b> (sans article après <i>de</i> : <i>desde la entrada en vigor <b>del</b> impuesto</i>). <b>2.</b> « américain » au sens des États-Unis → <b>estadounidense</b> ; <i>americano</i> désigne le continent et passe mal en copie. <b>3.</b> « se plaindre d'avoir fait » → <b>quejarse de + infinitif composé</b> (<i>de haber perdido</i>). <b>4.</b> Pas d'article partitif en espagnol : <i>han perdido <b>poder adquisitivo</b></i>, jamais <s>del poder adquisitivo</s>. <b>5.</b> « renchérir » → <b>encarecerse</b> (13/08) ; fait relié au présent → <b>pretérito perfecto</b> (<i>se han encarecido</i>). <b>6.</b> « les produits de base » → <b>los productos básicos</b> (ou <i>de primera necesidad</i>)."},
  {id:"s7t4",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Résumé analytique comparatif — 70 à 90 mots.</b> Contraintes obligatoires : (1) réponds directement à la question ; (2) <b>ne traite pas « document 1 puis document 2 »</b> : confronte-les ; (3) indique la <b>nature</b> de chaque texte (informatif / d'opinion) ; (4) emploie au moins <b>deux connecteurs d'opposition</b> vus aujourd'hui ; (5) <b>aucune opinion personnelle</b>, aucune phrase recopiée.",
   prompt:"¿Qué visión de las remesas ofrecen ambos documentos? <br><span style=\"font-style:normal\">(Les deux documents sont ceux de l'exercice précédent : relis-les avant d'écrire.)</span>",
   sol:"Ambos documentos abordan el peso de las remesas en México, pero desde perspectivas opuestas. El primero, de carácter informativo, subraya su solidez: crecieron un 3,1 % en el primer semestre de 2026, pese al nuevo impuesto estadounidense. El segundo, claramente crítico, ve en esa misma solidez un síntoma de dependencia: el dinero de los emigrantes sostiene el consumo, mientras que no transforma la economía ni protege a los hogares de las decisiones de Washington. Frente a la cifra, por su parte, el segundo texto opone sus límites estructurales.",

  {id:"s8c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",

  {id:"s8t2",etape:"APPLICATION CONCOURS",type:"theme",code:"LEX",

  {id:"s8t4",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Reformulation</b> — réécris cette phrase espagnole en <b>UNE seule phrase</b>, sans reprendre plus de <b>deux mots</b> de l'original (les chiffres et les noms propres ne comptent pas).",

  {id:"s8t5",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Mini-essai — 100 à 120 mots.</b> Contraintes obligatoires : (1) réponds à la question <b>dès la première phrase</b> et prends position ; (2) au moins <b>un chiffre daté</b> tiré du dossier de la séance ; (3) une <b>nuance</b> introduite par <i>ahora bien</i> ou <i>es cierto que… pero</i> ; (4) au moins une <b>structure d'opposition</b> vue les 17-19/08 (<i>mientras que</i>, <i>no… sino también</i>, <i>frente a</i>, <i>por su parte</i>) ; (5) pas d'introduction scolaire, pas de récitation.",
   prompt:"¿La actual abundancia relativa de agua en España, en agosto de 2026, debe tranquilizar a las autoridades?",
   sol:"La abundancia actual de agua no debe tranquilizar a nadie: confundir un buen año con una tendencia estructural sería un error. Es cierto que las reservas hídricas alcanzaron el 68,0 % el 11 de agosto de 2026, muy por encima de la media decadal, pero perdieron casi 1.000 hectómetros cúbicos en una sola semana y bajaron al 66,2 % el día 19. Además, las cuencas del sur —Segura 54 %, Júcar 56,4 %, Ebro 59,2 %— siguen muy por debajo del 60 %, mientras que las del norte superan el 80 %: la sequía no es solo climática, sino también territorial. Ahora bien, esta coyuntura favorable no debe convertirse en excusa, sino en tiempo ganado para invertir en ahorro y en infraestructuras.",
   regle:"Ce qui vaut la note : la <b>première phrase répond</b> et prend position (<i>no debe tranquilizar a nadie</i>) ; les chiffres sont <b>datés</b> et servent l'argument, jamais plaqués ; la <b>nuance</b> est introduite par <i>es cierto que… pero</i> (17/08) et repose sur un <b>contraste géographique concret</b>, pas sur une formule vague ; la conclusion <b>reformule la thèse</b> (<i>no… sino</i>) au lieu de résumer les données ; la seule structure ambitieuse (<i>convertirse en</i>, 11/08) est <b>parfaitement maîtrisée</b>. Trois charnières d'opposition sont utilisées (<i>mientras que</i>, <i>no solo… sino también</i>, <i>frente a</i> implicite dans le contraste) — sans surcharge. C'est le profil d'une copie 15-17 : phrases sûres, précision chiffrée, argumentation nette."}

 ex:[
  {id:"s9r1",etape:"RÉACTIVATION",type:"saisie",code:"LEX",
   consigne:"Un seul verbe espagnol (à l'infinitif).",
   prompt:"En España, muchos jóvenes no consiguen ___ antes de los treinta años (= prendre leur indépendance, quitter le domicile familial).",
   sol:["independizarse","emanciparse"],
   regle:"<b>independizarse</b> (ou <i>emanciparse</i>) — jamais <s>dejar la casa familiar</s>. <b>Réactivation J+1 du 20/08</b> : le point avait dormi neuf jours avant d'être rejoué hier ; on le remet aujourd'hui <b>dans une phrase complète</b>, ce qui est la seule façon de le fixer. Il reviendra vers le 28/08."},
  {id:"s9r2",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Complète (un seul mot).",
   prompt:"El Gobierno central no se dio cuenta ___ que el conflicto territorial iba a durar tanto.",
   sol:["de"],
   regle:"<b>darse cuenta DE que</b> : la préposition <b>ne disparaît jamais</b> devant <i>que</i>. L'omission (<s>darse cuenta que</s>) s'appelle le <i>queísmo</i> : très fréquente à l'oral en Espagne, elle reste une <b>faute</b> à l'écrit. Même série : <i>estar seguro <b>de</b> que</i>, <i>quejarse <b>de</b> que</i>, <i>acordarse <b>de</b> que</i>. Attention au piège inverse (<i>dequeísmo</i>) : on dit <i>pienso que</i>, jamais <s>pienso de que</s>. <b>Réactivation J+1 du 20/08</b>."},
  {id:"s9r3",etape:"RÉACTIVATION",type:"saisie",code:"LEX",
   consigne:"Un seul verbe, à la 3<sup>e</sup> personne du singulier : « l'auteur <b>nuance</b> son diagnostic ».",
   prompt:"El autor ___ su diagnóstico: reconoce que el sistema autonómico también acercó la administración a los ciudadanos.",
   sol:["matiza"],
   regle:"<b>matizar</b> = nuancer, apporter une nuance. La palette complète des verbes d'attribution : <i>sostener, afirmar, defender</i> (soutenir) · <i>señalar, subrayar</i> (souligner) · <i>denunciar</i> (dénoncer) · <i>lamentar</i> (déplorer) · <i>recordar</i> (rappeler) · <i>matizar</i> (nuancer) — tous suivis de <b>que + indicatif</b>. <b>Réactivation J+1 du 20/08</b>."},
  {id:"s9r4",etape:"RÉACTIVATION",type:"qcm",code:"GRAM",
   consigne:"Une seule de ces quatre phrases est correcte.",
   prompt:"Opinion niée ou certitude : quel mode ?",
   options:["No cabe duda de que el Estado autonómico sea un éxito.","No creo que el Estado autonómico ha resuelto el problema catalán.","No cabe duda de que el Estado autonómico acercó la administración a los ciudadanos.","Es evidente que el Estado autonómico haya reducido las desigualdades."],
   sol:2,
   regle:"Deux familles à ne jamais confondre. <b>Opinion niée → subjonctif</b> : <i>no creo que <b>haya resuelto</b></i>, <i>no considera que <b>sean</b></i> (donc la phrase 2 est fautive). <b>Certitude, même exprimée négativement → indicatif</b> : <i>no cabe duda de que <b>acercó</b></i>, <i>es evidente que <b>ha reducido</b></i> (donc les phrases 1 et 4 sont fautives). Repère : ce qui compte n'est pas la présence de <i>no</i>, mais le <b>degré de certitude</b>. <b>Réactivation J+1 du 20/08</b>."},
  {id:"s9r5",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Complète par la préposition qui convient (un seul mot).",
   prompt:"La oposición discrepa ___ el Gobierno sobre la financiación autonómica.",
   sol:["de","del"],
   regle:"<b>discrepar DE alguien</b> (diverger de quelqu'un) ; on peut aussi <i>discrepar <b>en</b> un punto</i>. Son contraire : <b>coincidir EN algo</b>. Ici, <i>discrepa <b>del</b> Gobierno</i> (contraction <i>de + el</i>). Série complète des prépositions régies du résumé : <i>coincidir en</i> · <i>discrepar de</i> · <i>oponerse a</i> · <i>diferir de</i> · <i>estar de acuerdo con alguien en algo</i>. <b>Réactivation J+2 du 19/08</b>."},
  {id:"s9r6",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Connecteur — complète (3 mots).",
   prompt:"El Congreso aprobó el texto; ___ ___ ___, el Senado lo ratificó una semana después.",
   sol:["por su parte"],
   regle:"<b>por su parte</b> = « pour sa part », « de son côté » : il sert à <b>enchaîner deux acteurs ou deux documents</b> sans les opposer frontalement. À ranger avec les autres charnières du résumé comparatif : <b>mientras que</b> (opposition), <b>en cambio</b> (contraste), <b>frente a</b> (comparaison chiffrée), <b>ahora bien</b> (nuance). <b>Réactivation J+2 du 19/08</b>."},

  {id:"s9c1",etape:"TRAVAIL CIBLÉ",type:"qcm",code:"CIV",
   consigne:"Civilisation — Espagne. Une seule réponse.",
   prompt:"¿Cómo se organiza territorialmente España desde la Constitución de 1978?",
   options:["En 15 comunidades autónomas y 3 ciudades autónomas","En 17 comunidades autónomas y 2 ciudades autónomas: Ceuta y Melilla","En 19 comunidades autónomas, sin ciudades autónomas","En 17 comunidades autónomas y 4 ciudades autónomas"],
   sol:1,
   regle:"<b>17 comunidades autónomas</b> et <b>2 ciudades autónomas</b>, <b>Ceuta</b> et <b>Melilla</b>, dotées de leur statut d'autonomie en <b>1995</b> (Leyes Orgánicas 1/1995 et 2/1995). La distinction est importante : une <i>ciudad autónoma</i> n'est <b>pas</b> une communauté autonome et dispose de compétences plus réduites. Le cadre est fixé par le <b>Título VIII</b> de la Constitution, intitulé <i>De la Organización Territorial del Estado</i> (art. 137-158). Vocabulaire : chaque communauté a son <b>Estatuto de Autonomía</b>, son <b>parlamento autonómico</b> et son <b>presidente</b>.",
   anki:{r:"Organisation territoriale de l'Espagne",v:"17 comunidades autónomas + 2 ciudades autónomas (Ceuta y Melilla, estatutos de 1995) — Título VIII de la Constitución",t:"CIV-ESPAGNE"}},
  {id:"s9c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Complète (un seul mot, avec la majuscule).",
   prompt:"Las Cortes Generales están formadas por el Congreso de los Diputados y el ___.",
   sol:["Senado"],
   regle:"<b>Las Cortes Generales</b> = le Parlement espagnol, <b>bicaméral</b> : le <b>Congreso de los Diputados</b> (chambre basse, <b>350</b> députés) et le <b>Senado</b> (chambre haute, dite <i>cámara de representación territorial</i>). Deux fautes de lexique à bannir en copie : <s>el primer ministro</s> — on dit <b>el presidente del Gobierno</b> — et <s>el parlamento español</s> employé seul quand on désigne les Cortes."},
  {id:"s9c3",etape:"TRAVAIL CIBLÉ",type:"qcm",code:"CIV",
   consigne:"Civilisation — Espagne. Une seule réponse.",
   prompt:"¿Qué cámara debe aprobar la aplicación del artículo 155 de la Constitución?",
   options:["El Congreso de los Diputados, por mayoría simple","El Senado, por mayoría absoluta","Las dos cámaras reunidas en sesión conjunta","El Tribunal Constitucional"],
   sol:1,
   regle:"L'<b>article 155</b> autorise le Gouvernement, après une mise en demeure (<i>requerimiento</i>) restée sans effet, à prendre les mesures nécessaires pour contraindre une communauté autonome à respecter ses obligations — <b>avec l'approbation du Sénat à la majorité absolue</b>, et de lui seul. Il n'a été appliqué qu'<b>une seule fois</b> : le <b>27 octobre 2017</b>, en <b>Catalogne</b>, après la déclaration unilatérale d'indépendance ; le gouvernement de Mariano Rajoy avait alors destitué l'exécutif de Carles Puigdemont et convoqué des élections anticipées. Le Tribunal Constitucional a ensuite validé cette application. C'est <b>l'exemple par excellence</b> des limites de l'État des autonomies.",
   anki:{r:"Article 155 de la Constitution espagnole",v:"El Gobierno puede intervenir una comunidad con el visto bueno del SENADO por mayoría absoluta — aplicado una sola vez: Cataluña, 27/10/2017",t:"CIV-ESPAGNE"}},
  {id:"s9c4",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"GRAM",
   consigne:"Conjugue au temps et au mode qui conviennent (un seul mot).",
   prompt:"La Constitución exige que el Senado ___ (aprobar) esas medidas por mayoría absoluta.",
   sol:["apruebe"],
   regle:"Verbe de volonté, d'ordre ou d'exigence (<i>exigir, pedir, querer, ordenar, permitir, impedir</i>) → <b>subjonctif</b> dans la subordonnée. Principale au présent → <b>subjonctif présent</b> ; principale au passé ou au conditionnel → <b>imparfait du subjonctif</b> (<i>la Constitución exigía que el Senado <b>aprobara</b>…</i>). Ne pas oublier la <b>diphtongue o→ue</b> : <i>aprobar → apruebe</i>, jamais <s>aprobe</s>."},
  {id:"s9c5",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Traduis l'expression (3 mots, avec l'article défini).",
   prompt:"« la répartition des compétences » (entre l'État et les régions) se dit : ___",
   sol:["el reparto de competencias","reparto de competencias"],
   regle:"<b>el reparto de competencias</b> (ou <i>la distribución de competencias</i>) — jamais <s>la repartición</s>, qui n'existe pas dans ce sens. Famille à retenir en bloc : <b>las competencias transferidas</b> (les compétences transférées), <b>asumir competencias</b> (obtenir des compétences), <b>la financiación autonómica</b> (le financement des régions), <b>el Estado de las autonomías</b>. C'est le vocabulaire qui revient dans <b>tout</b> sujet sur la question territoriale espagnole.",
   anki:{r:"la répartition des compétences / les compétences transférées",v:"el reparto de competencias · las competencias transferidas · la financiación autonómica",t:"LEX"}},

  {id:"s9t1",etape:"APPLICATION CONCOURS",type:"qcm",code:"CIV",
   consigne:"Civilisation — Espagne. Une seule réponse.",
   prompt:"¿Cuántas veces se ha reformado la Constitución española de 1978?",
   options:["Nunca: sigue intacta","Dos veces","Cuatro veces","Once veces"],
   sol:2,
   regle:"<b>Quatre révisions</b> seulement en presque cinquante ans, ce qui fait de la Constitution de 1978 un texte remarquablement <b>rigide</b> — et de sa longévité un argument à double tranchant. <b>1992</b> : art. 13.2, droit de suffrage <i>pasivo</i> des étrangers communautaires aux municipales (traité de Maastricht). <b>2011</b> : art. 135, principe de stabilité budgétaire, adopté en pleine crise de la dette. <b>2024</b> : art. 49, remplacement du terme <i>disminuidos</i> par <i>personas con discapacidad</i>. <b>2026</b> : art. 69.3, pour que l'île de <b>Formentera</b> élise son propre sénateur. Argument réutilisable : la difficulté à réformer la Constitution explique en partie <b>l'enlisement de la question territoriale</b>.",
   anki:{r:"Réformes de la Constitution espagnole de 1978",v:"Solo cuatro: 1992 (art. 13.2), 2011 (art. 135), 2024 (art. 49), 2026 (art. 69.3, Formentera)",t:"CIV-ESPAGNE"}},
  {id:"s9t2",etape:"APPLICATION CONCOURS",type:"theme",code:"GRAM",
   consigne:"Thème court — traduis en espagnol.",
   prompt:"Bien que la Constitution de 1978 n'ait été révisée que quatre fois, elle reste la constitution la plus durable de l'histoire de l'Espagne.",
   sol:"Aunque la Constitución de 1978 solo se ha reformado cuatro veces, sigue siendo la constitución más longeva de la historia de España.",
   regle:"Points de contrôle : <b>1.</b> <b>aunque + indicatif</b> — le fait est réel et admis ; le subjonctif en ferait une hypothèse. <b>2.</b> « ne… que » → <b>solo</b> (ou <i>únicamente</i>), jamais <s>no… que</s>. <b>3.</b> Voix passive → <b>se de sens passif</b> : <i>se ha reformado</i>, bien plus naturel que <i>ha sido reformada</i>. <b>4.</b> « elle reste » → <b>sigue siendo</b> (<i>seguir</i> + gérondif, revu les 18 et 19/08), jamais <s>queda</s>. <b>5.</b> « le plus … de » → <b>más … de</b> : <i>la más longeva <b>de</b> la historia</i>. <b>6.</b> <i>longevo</i> est le mot exact pour un texte ou une institution qui dure ; <i>duradero</i> reste correct."},
  {id:"s9t3",etape:"APPLICATION CONCOURS",type:"theme",code:"METH",
   consigne:"<b>Thème suivi — traduis le paragraphe entier, en un seul bloc.</b> Ne traduis pas phrase à phrase : rédige, puis relis-toi pour vérifier les prépositions, les accents, les majuscules et l'écriture des dates.",
   prompt:"Approuvée par référendum le 6 décembre 1978, la Constitution espagnole a mis fin à quarante ans de dictature. Elle a créé un État des autonomies qui compte aujourd'hui dix-sept communautés autonomes et deux villes autonomes, Ceuta et Melilla. Bien que ce modèle ait rapproché l'administration des citoyens, il n'a pas mis fin aux tensions territoriales : en octobre 2017, le gouvernement a appliqué pour la première fois l'article 155 en Catalogne. Quarante-huit ans plus tard, le texte n'a été révisé que quatre fois.",
   sol:"Aprobada en referéndum el 6 de diciembre de 1978, la Constitución española puso fin a cuarenta años de dictadura. Creó un Estado de las autonomías que hoy cuenta con diecisiete comunidades autónomas y dos ciudades autónomas, Ceuta y Melilla. Aunque este modelo ha acercado la administración a los ciudadanos, no ha acabado con las tensiones territoriales: en octubre de 2017, el Gobierno aplicó por primera vez el artículo 155 en Cataluña. Cuarenta y ocho años después, el texto solo se ha reformado cuatro veces.",
   regle:"Points de contrôle, un par un : <b>1.</b> « approuvée par référendum » → <b>aprobada EN referéndum</b> (jamais <s>por referéndum</s>). <b>2.</b> Date complète : <b>el 6 de diciembre de 1978</b> — deux <i>de</i>, aucun article devant le mois. <b>3.</b> « mettre fin à » → <b>poner fin a</b> ou <b>acabar con</b> ; fait daté et clos → <b>indefinido</b> (<i>puso fin</i>). <b>4.</b> « compter » (au sens de comporter) → <b>contar CON</b>. <b>5.</b> <b>aunque + indicatif</b> : le rapprochement administratif est un fait admis. <b>6.</b> « rapprocher X de Y » → <b>acercar X A Y</b> — la préposition change par rapport au français. <b>7.</b> Les deux-points espagnols ne prennent <b>pas</b> d'espace avant : <i>territoriales:</i>. <b>8.</b> <b>el Gobierno</b> avec majuscule quand il désigne l'exécutif ; <b>comunidades autónomas</b> en minuscules. <b>9.</b> <b>Cataluña</b> en espagnol (jamais <i>Catalunya</i> dans une copie d'espagnol). <b>10.</b> Nombres en toutes lettres : <i>diecisiete</i>, <i>cuarenta y ocho</i>. <b>11.</b> « n'a été révisé que » → <b>solo se ha reformado</b> (se de sens passif + <i>pretérito perfecto</i>, car le lien avec le présent est maintenu).",
   anki:{r:"Constitution espagnole — date et adoption",v:"Aprobada en referéndum el 6 de diciembre de 1978 (participación ~67 %, cerca del 88 % de sí); en vigor el 29 de diciembre de 1978",t:"CIV-ESPAGNE"}},
  {id:"s9t4",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Mini-essai — 100 à 120 mots.</b> Contraintes obligatoires : (1) réponds à la question <b>dès la première phrase</b> et prends position ; (2) au moins <b>deux faits datés</b> tirés de la séance ; (3) une <b>nuance</b> introduite par <i>es cierto que… pero</i> ou <i>ahora bien</i> ; (4) au moins une <b>structure d'opposition</b> (<i>mientras que</i>, <i>frente a</i>, <i>no… sino también</i>, <i>por su parte</i>) ; (5) ni introduction scolaire, ni récitation de cours.",
   prompt:"¿Ha logrado el Estado de las autonomías resolver la cuestión territorial en España?",
   sol:"El Estado de las autonomías ha transformado España, pero no ha resuelto la cuestión territorial. Es cierto que el modelo nacido de la Constitución del 6 de diciembre de 1978 acercó la administración a los ciudadanos y dio un marco legal a las identidades regionales, pero no impidió la crisis catalana: en octubre de 2017 el Gobierno tuvo que aplicar por primera vez el artículo 155. Mientras que el País Vasco y Navarra disponen de un régimen fiscal propio, otras comunidades siguen discutiendo su financiación, de modo que el reparto de competencias sigue siendo profundamente desigual. Ahora bien, ninguna alternativa creíble ha surgido: el problema no es el modelo en sí, sino su falta de actualización.",
   regle:"Ce qui vaut la note : <b>1.</b> la <b>première phrase répond</b> et tranche (<i>ha transformado… pero no ha resuelto</i>) — aucune introduction, aucune fausse problématique. <b>2.</b> Les deux faits sont <b>datés et exacts</b> (6 décembre 1978, octobre 2017) et <b>servent l'argument</b> au lieu d'être plaqués. <b>3.</b> La <b>nuance</b> arrive après la prise de position, avec <i>es cierto que… pero</i>. <b>4.</b> Le <b>contraste interne</b> (Pays basque et Navarre, qui disposent d'un régime fiscal propre — <i>Concierto Económico</i> et <i>Convenio Económico</i> — face aux autres communautés) montre une connaissance <b>précise</b>, pas un slogan. <b>5.</b> La conclusion <b>reformule la thèse</b> par <i>no… sino</i> au lieu de résumer. <b>6.</b> Toutes les structures employées ont déjà été travaillées : <i>seguir + gérondif</i>, <i>de modo que + indicatif</i>, <i>mientras que</i>, <i>el reparto de competencias</i>. Rien d'artificiellement sophistiqué : c'est exactement le profil d'une copie 15-17."}
 ]
},
{
 id:"s10", num:10, date:"2026-08-24", jour:"lundi 24 août 2026",
 titre:"Conjugaison — les 3es personnes — et thème suivi",
 themes:"pretérito indefinido irrégulier · imparfait du subjonctif · exigir/pedir que + subjonctif · thème suivi · lois de mémoire",
 retenir:[
   "<b>Les trois familles de 3<sup>es</sup> personnes à l'indefinido</b>, celles que le jury voit rater le plus souvent : <b>1.</b> radicaux forts en <b>-j-</b> → terminaison <b>-eron</b> sans i (<i>produjeron, dijeron, trajeron, condujeron</i>) ; <b>2.</b> verbes en <b>-ir</b> à alternance, qui ne change qu'aux 3<sup>es</sup> personnes (<i>durmió/durmieron, pidió/pidieron, sintió/sintieron, murió/murieron</i>) ; <b>3.</b> <b>i → y</b> entre deux voyelles (<i>destruyó/destruyeron, leyó/leyeron, cayó/cayeron, oyó/oyeron</i>).",
   "L'<b>imparfait du subjonctif</b> se fabrique <b>toujours</b> sur la 3<sup>e</sup> personne du pluriel de l'indefinido : <i>invirtieron → invirtiera / invirtiese</i>, <i>propusieron → propusiera</i>, <i>durmieron → durmiera</i>. Aucune exception. C'est la règle la plus rentable de toute la conjugaison espagnole : elle supprime d'un coup les barbarismes du type <s>proponieron</s>, <s>invertiera</s>.",
   "<b>Lois de mémoire</b> : la <i>Ley 52/2007</i> du 26 décembre 2007 (mémoire historique, gouvernement Zapatero) a été <b>abrogée</b> — le BOE écrit <i>derogada</i>, pas « remplacée » — par la <i>Ley 20/2022, de 19 de octubre, de Memoria Democrática</i> (BOE du 20/10/2022). Apport décisif : c'est désormais l'<b>État</b> qui pilote la recherche des disparus et les exhumations, là où la loi de 2007 laissait l'initiative aux familles."
 ],
 immersion:{
   pays:"Espagne", type:"📰 Article",
   sujet:"Le 20 août 2026, Sara Aagesen, vice-présidente troisième du gouvernement et ministre de la Transition écologique, a chiffré à 262.030 hectares la superficie brûlée en Espagne depuis le 1er janvier, avec 43 grands incendies. Le système satellitaire européen EFFIS/Copernicus, lui, en comptabilise 296.999 au 19 août, soit 48,1 % des 616.202 hectares brûlés dans toute l'Union européenne. L'Espagne est de loin le premier pays de l'UE en surface brûlée, mais seulement le deuxième en nombre de feux (422), derrière l'Italie (448) et devant la France (355). Le 17 août a été le premier jour de la campagne où le cumul de 2026 est repassé sous celui de 2025 (367.520 ha au 19 août 2025).",
   pourquoi:"Sujet à très haut rendement, parce qu'il sert dans quatre dossiers différents : <b>environnement et urgence climatique</b>, <b>España vaciada</b> et dépeuplement rural, <b>répartition des compétences</b> État / communautés autonomes (l'extinction relève largement des CCAA), et <b>place de l'Espagne dans l'UE</b>. Surtout, il apprend un réflexe de concours : <b>deux chiffres différents ne sont pas forcément une contradiction</b>. 262.030 (statistique officielle espagnole) et 296.999 (estimation satellitaire européenne) relèvent de deux méthodes ; en copie, on cite <b>un seul chiffre en nommant sa source et sa date</b>, jamais les deux comme s'il s'agissait du même compte.",
   mots:["la superficie calcinada — la superficie brûlée, calcinée","el gran incendio forestal — le grand incendie de forêt","la emergencia climática — l'urgence climatique"],
   question:"¿Por qué las cifras de superficie quemada difundidas por el Gobierno español y las publicadas por el sistema europeo Copernicus no coinciden, y qué precaución impone esa diferencia a la hora de citarlas en una redacción?",
   url:"https://www.telecinco.es/noticias/espana/20260820/incendios-forestales-espana-cifras-hectareas-arrasadas_18_019987658.html",
   source:"Telecinco, 20/08/2026. Chiffres recoupés avec Agencia EFE via Infobae (20/08/2026) et Europa Press via Diario de León (20/08/2026) pour les 262.030 ha et les 43 grands incendies ; avec Moncloa.com (20/08/2026) pour les données EFFIS/Copernicus. Prudence : le bilan final de 2025 varie selon les sources (393.079 / 393.279 / « plus de 400.000 ha ») — ne pas le citer chiffré, s'en tenir à « 2025, pire année depuis 1994 »."
 },
 ex:[
  {id:"s10r1",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : le verbe entre parenthèses, au <b>présent, 3<sup>e</sup> personne du pluriel</b>.",
   prompt:"Ambos autores ___ (matizar) su diagnóstico y reconocen algunos avances del Estado autonómico.",
   sol:["matizan"],
   regle:"<b>matizar</b> = nuancer, apporter une réserve. <b>Réactivation J+1 du 21/08</b>, mais avec un angle neuf : cette fois c'est la <b>3<sup>e</sup> personne du pluriel</b> qui est visée, l'endroit exact où le jury relève le plus de fautes. Garde en tête la palette complète des verbes d'attribution, indispensable au résumé analytique : <i>señalar</i> (signaler), <i>subrayar</i> (souligner), <i>matizar</i> (nuancer), <i>denunciar</i> (dénoncer), <i>reprochar</i> (reprocher), <i>constatar</i> (constater). Tous se construisent avec l'<b>indicatif</b>."},
  {id:"s10r2",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Complète : un seul mot.",
   prompt:"El segundo autor discrepa ___ análisis del primero y defiende una lectura mucho más optimista.",
   sol:["del"],
   regle:"<b>discrepar DE</b> — jamais <s>discrepar con</s> ni <s>discrepar a</s>. Ici <i>de + el</i> se contracte obligatoirement en <b>del</b> : c'est la seule contraction de l'espagnol avec <i>al</i>. Le couple à retenir pour le résumé analytique : <b>coincidir EN</b> (être d'accord sur) / <b>discrepar DE</b> (être en désaccord avec). <b>Réactivation J+2 du 21/08.</b>"},
  {id:"s10r3",etape:"RÉACTIVATION",type:"saisie",code:"SYN",
   consigne:"Trois mots — le connecteur qui introduit le second point de vue.",
   prompt:"El Gobierno central defiende el modelo actual; las comunidades autónomas, ___, denuncian una financiación insuficiente.",
   sol:["por su parte"],
   regle:"<b>por su parte</b> = « de son côté », « pour sa part ». C'est le connecteur le plus économique pour passer d'un acteur à l'autre <b>sans</b> retomber dans le « document 1 puis document 2 » que les jurys sanctionnent. Variantes utiles : <i>en cambio</i> (en revanche), <i>por el contrario</i> (au contraire), <i>mientras que</i> (tandis que, contraste). <b>Réactivation J+1 du 21/08.</b>"},
  {id:"s10r4",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : le verbe entre parenthèses, à la forme qui convient.",
   prompt:"Varias comunidades exigen que el Estado ___ (transferir) nuevas competencias en materia de vivienda.",
   sol:["transfiera"],
   regle:"<b>exigir que + subjonctif</b> : tout verbe de volonté, d'ordre ou de demande (<i>exigir, pedir, rogar, ordenar, querer, esperar</i>) impose le subjonctif dans la subordonnée. Le sujet est <b>el Estado</b>, 3<sup>e</sup> personne du <b>singulier</b> → <b>transfiera</b>. <i>Transferir</i> est un verbe à diphtongue <b>e → ie</b> (comme <i>preferir, sentir, invertir</i>) : <i>transfiero, transfieres, transfiera…</i> <b>Réactivation J+1 du 21/08</b>, où le verbe était <i>aprobar</i> (o → ue)."},
  {id:"s10r5",etape:"RÉACTIVATION",type:"saisie",code:"LEX",
   consigne:"Quatre mots, article compris.",
   prompt:"En España, ___ entre el Estado y las autonomías sigue siendo una fuente permanente de conflicto político.",
   sol:["el reparto de competencias"],
   regle:"<b>el reparto de competencias</b> = la répartition des compétences. Le mot exact est <i>reparto</i> (ou <i>el reparto competencial</i>), pas <s>la repartición</s>. Famille à automatiser : <b>las competencias transferidas</b> (les compétences transférées), <b>la financiación autonómica</b> (le financement des régions), <b>el traspaso de competencias</b> (le transfert de compétences). <b>Réactivation J+1 du 21/08.</b>"},
  {id:"s10r6",etape:"RÉACTIVATION",type:"qcm",code:"CIV",
   consigne:"Civilisation — institutions espagnoles. Une seule réponse.",
   prompt:"Para aplicar el artículo 155 de la Constitución, el Gobierno necesita:",
   options:["la aprobación del Congreso de los Diputados por mayoría simple","la aprobación del Senado por mayoría absoluta","la aprobación conjunta de las dos cámaras de las Cortes Generales","una sentencia previa del Tribunal Constitucional"],
   sol:1,
   regle:"C'est le <b>Sénat seul</b>, à la <b>majorité absolue</b>, qui autorise l'application de l'article 155 — et seulement après un <i>requerimiento</i> resté sans effet. Détail décisif, parce qu'il surprend : le Congrès, chambre politiquement dominante, n'intervient <b>pas</b>. Le mécanisme n'a été utilisé <b>qu'une seule fois</b> : accord du <i>Pleno del Senado</i> le <b>27 octobre 2017</b>, en Catalogne. Rappel du vocabulaire : <b>las Cortes Generales</b> = <i>Congreso de los Diputados</i> (350 députés) + <i>Senado</i>. <b>Réactivation cumulative du 21/08.</b>"},
  {id:"s10c1",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Los incendios del verano pasado ___ (producir) daños irreparables en varios parques naturales.",
   sol:["produjeron"],
   regle:"Première famille des 3<sup>es</sup> personnes irrégulières : les <b>radicaux forts terminés par -j-</b>. Ils prennent la terminaison <b>-eron</b>, <b>sans i</b> : <i>produjeron</i>, jamais <s>produjieron</s>. Toute la série fonctionne pareil : <b>decir → dijeron</b>, <b>traer → trajeron</b>, <b>conducir → condujeron</b>, <b>traducir → tradujeron</b>, <b>reducir → redujeron</b>. Retiens la règle par sa cause : le <i>j</i> absorbe le <i>i</i>. Tous les verbes en <b>-ducir</b> suivent ce modèle.",
   anki:{r:"Indefinido — 3e pers. du pluriel : produire · dire · apporter · conduire",v:"produjeron · dijeron · trajeron · condujeron — radical fort en -j- + terminaison -eron, JAMAIS -ieron",t:"CONJ"}},
  {id:"s10c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Muchos vecinos ___ (dormir) fuera de sus casas durante las noches del incendio.",
   sol:["durmieron"],
   regle:"Deuxième famille : les verbes en <b>-ir</b> à alternance vocalique. À l'indefinido, le changement ne touche <b>que les deux 3<sup>es</sup> personnes</b> — c'est précisément pour cela que le jury les vise. <b>o → u</b> : <i>dormir → durmió / durmieron</i>, <i>morir → murió / murieron</i>. <b>e → i</b> : <i>pedir → pidió / pidieron</i>, <i>sentir → sintió / sintieron</i>, <i>seguir → siguió / siguieron</i>, <i>preferir → prefirió / prefirieron</i>. Attention : <i>dormimos, dormiste, dormí</i> restent réguliers."},
  {id:"s10c3",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Las llamas ___ (destruir) más de veinte viviendas en menos de dos horas.",
   sol:["destruyeron"],
   regle:"Troisième famille : le <b>i devient y</b> quand il se retrouve entre deux voyelles. Verbes en <b>-uir</b> : <i>destruir → destruyó / destruyeron</i>, <i>construir → construyó / construyeron</i>, <i>huir → huyó / huyeron</i>, <i>concluir → concluyó / concluyeron</i>. Même phénomène ailleurs : <i>leer → leyó / leyeron</i>, <i>caer → cayó / cayeron</i>, <i>oír → oyó / oyeron</i>, <i>creer → creyó / creyeron</i>. Là encore, seules les 3<sup>es</sup> personnes changent."},
  {id:"s10c4",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : le verbe à l'<b>imparfait du subjonctif</b>, 3<sup>e</sup> personne du pluriel.",
   prompt:"El Gobierno pidió a las comunidades que ___ (invertir) mucho más en prevención.",
   sol:["invirtieran","invirtiesen"],
   regle:"La règle la plus rentable de la conjugaison espagnole : l'<b>imparfait du subjonctif se forme toujours sur la 3<sup>e</sup> personne du pluriel de l'indefinido</b>, sans aucune exception. On part de <i>invirtieron</i>, on retire <i>-ron</i>, on ajoute <b>-ra</b> ou <b>-se</b> → <b>invirtieran</b> / <b>invirtiesen</b> (les deux formes sont correctes et interchangeables). Même méthode : <i>tuvieron → tuviera</i>, <i>dijeron → dijera</i>, <i>durmieron → durmiera</i>, <i>fueron → fuera</i>. Ici, <b>concordance des temps</b> : verbe principal au passé (<i>pidió</i>) → subordonnée à l'imparfait du subjonctif, jamais au présent. <b>Réactivation du 18/08</b> (<i>invirtiera</i>).",
   anki:{r:"Comment forme-t-on l'imparfait du subjonctif espagnol ?",v:"Toujours sur la 3e personne du pluriel de l'indefinido : invirtieron → invirtiera/invirtiese; tuvieron → tuviera; dijeron → dijera. Aucune exception.",t:"CONJ"}},
  {id:"s10c5",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"CONJ",
   consigne:"Une seule forme verbale est fautive dans cette phrase. Écris <b>uniquement</b> la forme corrigée.",
   prompt:"El año pasado, las comunidades autónomas no quisieron asumir el coste, el Estado tuvo que intervenir y los expertos proponieron un nuevo modelo de financiación.",
   sol:["propusieron"],
   regle:"<b>proponieron</b> n'existe pas : c'est un barbarisme verbal, et le jury le sanctionne lourdement. <i>Proponer</i> est un composé de <b>poner</b> : il en hérite le radical fort <b>-pus-</b> → <b>propusieron</b>. Toute la famille suit : <i>poner → pusieron</i>, <i>suponer → supusieron</i>, <i>imponer → impusieron</i>, <i>componer → compusieron</i>. Réflexe à installer : dès qu'un verbe contient <i>-poner</i>, <i>-tener</i>, <i>-venir</i> ou <i>-decir</i>, il se conjugue comme le verbe simple (<i>mantener → mantuvieron</i>, <i>intervenir → intervinieron</i>, <i>predecir → predijeron</i>). Les deux autres formes de la phrase étaient correctes : <b>quisieron</b> (<i>querer</i>, radical <i>quis-</i>) et <b>tuvo</b> (<i>tener</i>, radical <i>tuv-</i>).",
   anki:{r:"« ils proposèrent » — pretérito indefinido",v:"propusieron (proponer = composé de poner → radical -pus-). Barbarisme interdit : proponieron",t:"CONJ"}},
  {id:"s10t1",etape:"APPLICATION CONCOURS",type:"qcm",code:"CIV",
   consigne:"Civilisation — Espagne contemporaine. Une seule réponse.",
   prompt:"La Ley 52/2007, conocida como « ley de memoria histórica », fue:",
   options:["ampliada por la Ley 20/2022 de Memoria Democrática, que la completa","derogada por la Ley 20/2022, de 19 de octubre, de Memoria Democrática","anulada por el Tribunal Constitucional en 2022","suspendida tras las elecciones generales de julio de 2023"],
   sol:1,
   regle:"Le BOE est formel : la <i>Ley 52/2007</i> (26 décembre 2007, gouvernement Zapatero) est <b>derogada</b> — <b>abrogée</b>, pas complétée — depuis le 21 octobre 2022, par la <b>Ley 20/2022, de 19 de octubre, de Memoria Democrática</b> (gouvernement Sánchez, BOE du 20/10/2022). La nuance vaut des points, parce que la plupart des candidats écrivent « remplacée » ou « élargie ». Ce que la loi de 2022 change concrètement : <b>1.</b> l'<b>État</b> prend la direction de la recherche des disparus et des exhumations (la loi de 2007 s'en remettait aux familles et aux associations) ; <b>2.</b> création d'un <b>registre des victimes</b> couvrant 1936-1978 ; <b>3.</b> <b>nullité</b> — et non plus simple « illégitimité » — des condamnations prononcées par les tribunaux franquistes ; <b>4.</b> création d'un <i>Fiscal de Sala de Derechos Humanos y Memoria Democrática</i> ; <b>5.</b> le <i>Valle de los Caídos</i> devient officiellement le <b>Valle de Cuelgamuros</b>. Repères associés : Franco exhumé le <b>24 octobre 2019</b> et réinhumé au cimetière de Mingorrubio (El Pardo) ; José Antonio Primo de Rivera transféré au cimetière de San Isidro le <b>24 avril 2023</b>.",
   anki:{r:"Loi de mémoire historique de 2007 — que devient-elle ?",v:"Derogada (abrogée) por la Ley 20/2022, de 19 de octubre, de Memoria Democrática — BOE del 20/10/2022, en vigor el 21/10/2022",t:"CIV-ESPAGNE"}},
  {id:"s10t2",etape:"APPLICATION CONCOURS",type:"theme",code:"THEME",
   consigne:"<b>Thème court.</b> Traduis la phrase entière. Relis-toi sur les temps du passé et sur la ponctuation.",
   prompt:"L'été dernier, les pompiers ne purent pas éteindre l'incendie : le vent soufflait très fort et les flammes détruisirent plus de vingt maisons.",
   sol:"El verano pasado, los bomberos no pudieron apagar el incendio: el viento soplaba muy fuerte y las llamas destruyeron más de veinte casas.",
   regle:"Points de contrôle : <b>1.</b> « l'été dernier » → <b>el verano pasado</b>, sans préposition. <b>2.</b> <i>poder</i> à l'indefinido → radical fort <b>pud-</b> : <b>pudieron</b> (jamais <s>poderon</s>). <b>3.</b> « éteindre un incendie » → <b>apagar</b> (ou <i>extinguir</i>) ; <s>extinguir</s> est plus technique, <i>apagar</i> est le mot courant. <b>4.</b> <b>Alternance des temps du passé</b>, l'un des critères les mieux notés : le vent qui souffle est un <b>décor</b>, une durée → <b>imparfait</b> (<i>soplaba</i>) ; les actions ponctuelles et closes → <b>indefinido</b> (<i>pudieron, destruyeron</i>). <b>5.</b> <i>destruir</i> → <b>destruyeron</b> (i → y, revu à l'exercice précédent). <b>6.</b> « plus de » devant un nombre → <b>más de</b>, jamais <s>más que</s> — <b>réactivation du 20/08</b>. <b>7.</b> Les <b>deux-points espagnols ne prennent pas d'espace avant</b> : <i>incendio:</i> et non <i>incendio :</i>."},
  {id:"s10t3",etape:"APPLICATION CONCOURS",type:"theme",code:"METH",
   consigne:"<b>Thème suivi — traduis le paragraphe entier, en un seul bloc.</b> Rédige d'abord, puis relis-toi en vérifiant une chose à la fois : les temps, les prépositions, les accents, l'écriture des dates et des nombres.",
   prompt:"Le 20 août 2026, la ministre de la Transition écologique a chiffré à 262 030 hectares la superficie brûlée en Espagne depuis le début de l'année. Le système européen Copernicus, pour sa part, en comptabilise près de 297 000 : les deux séries ne se contredisent pas, car elles ne reposent pas sur la même méthode. Bien que l'Espagne soit le pays de l'Union européenne le plus touché, le 17 août le cumul de 2026 est passé pour la première fois sous celui de 2025. De nombreux habitants durent dormir hors de chez eux, et les experts ont exigé que l'État investisse davantage dans la prévention.",
   sol:"El 20 de agosto de 2026, la ministra de Transición Ecológica cifró en 262.030 hectáreas la superficie quemada en España desde principios de año. El sistema europeo Copernicus, por su parte, contabiliza cerca de 297.000: las dos series no se contradicen, porque no se basan en el mismo método. Aunque España es el país de la Unión Europea más afectado, el 17 de agosto el acumulado de 2026 pasó por primera vez por debajo del de 2025. Muchos vecinos tuvieron que dormir fuera de sus casas, y los expertos han exigido que el Estado invierta más en prevención.",
   regle:"Points de contrôle, un par un : <b>1.</b> Date : <b>el 20 de agosto de 2026</b> — deux <i>de</i>, mois en minuscule, aucun article devant le mois. <b>2.</b> « chiffrer à » → <b>cifrar EN</b> (jamais <s>cifrar a</s>) ; fait daté et clos → <b>indefinido</b> : <i>cifró</i>. <b>3.</b> <b>la ministra</b> : le féminin est aujourd'hui la norme en espagnol (<i>la ministra, la presidenta, la jueza</i>). <b>4.</b> <b>Séparateur des milliers</b> : l'espagnol écrit <b>262.030</b> avec un point, jamais avec l'espace du français. <b>5.</b> « pour sa part » → <b>por su parte</b>, entre virgules (revu en réactivation). <b>6.</b> <b>Deux-points sans espace avant</b> : <i>297.000:</i>. <b>7.</b> « reposer sur » → <b>basarse EN</b>. <b>8.</b> <b>Aunque + indicatif</b> (<i>es</i>) : le fait est réel et admis ; le subjonctif en ferait une simple hypothèse. <b>9.</b> « sous celui de 2025 » → <b>por debajo del de 2025</b> : le pronom <i>el</i> reprend <i>el acumulado</i>, et <i>de + el</i> se contracte en <b>del</b>. <b>10.</b> « durent dormir » → <b>tuvieron que dormir</b> : obligation ponctuelle et accomplie, donc <i>tener que</i> à l'indefinido. <b>11.</b> « ont exigé que… investisse » → <b>han exigido que… invierta</b> : verbe de volonté → <b>subjonctif</b>, et <i>invertir</i> diphtongue en <b>e → ie</b>. <b>12.</b> « investir dans » → <b>invertir EN</b>.",
   anki:{r:"Incendies en Espagne — superficie brûlée, été 2026",v:"262.030 ha et 43 grands incendies au 20/08/2026 selon le Gouvernement; 296.999 ha au 19/08 selon EFFIS-Copernicus, soit el 48,1 % del total de la UE. Citer UNE seule fuente con su fecha.",t:"ACTU"}},
  {id:"s10t4",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Paragraphe argumenté — 60 à 80 mots.</b> Quatre contraintes obligatoires : (1) au moins <b>trois verbes au pretérito indefinido à la 3<sup>e</sup> personne du pluriel</b> ; (2) <b>un chiffre daté</b> de la séance, avec sa source ; (3) une structure <b>exigir / pedir que + subjonctif</b>, avec la bonne concordance des temps ; (4) le connecteur <b>por su parte</b> ou <b>mientras que</b>. Réponds à la question dès la première phrase : pas d'introduction.",
   prompt:"¿Qué revela la temporada de incendios de 2026 sobre la gestión del riesgo climático en España?",
   sol:"La temporada de 2026 demuestra que España sigue reaccionando mucho más que previniendo. Las llamas destruyeron miles de hectáreas y muchos vecinos durmieron fuera de sus casas, mientras que los medios de extinción dependen sobre todo de las comunidades autónomas. El 20 de agosto, el Gobierno cifró en 262.030 hectáreas la superficie quemada; Copernicus, por su parte, contabilizó cerca de 297.000. Por eso los expertos exigieron que el Estado invirtiera más en prevención.",
