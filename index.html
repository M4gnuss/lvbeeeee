   regle:"Ce qui vaut la note : <b>1.</b> la <b>première phrase répond</b> et tranche (<i>sigue reaccionando más que previniendo</i>) — aucune introduction, aucune fausse problématique. <b>2.</b> Les trois indefinidos à la 3<sup>e</sup> personne du pluriel sont les trois familles travaillées aujourd'hui : <b>destruyeron</b> (i → y), <b>durmieron</b> (o → u), <b>exigieron</b>. <b>3.</b> La <b>concordance</b> est respectée : <i>exigieron</i> au passé → <b>invirtiera</b> à l'imparfait du subjonctif, jamais <s>invierta</s>. <b>4.</b> Le chiffre est <b>daté et attribué</b> (<i>el 20 de agosto, el Gobierno cifró en…</i>), et le second est présenté comme une <b>autre source</b>, pas comme une contradiction : c'est exactement le réflexe qui distingue une copie sérieuse. <b>5.</b> <b>mientras que</b> introduit un vrai contraste institutionnel (l'État légifère, les communautés éteignent), pas une opposition décorative. <b>6.</b> Aucune tournure rare : que des structures déjà maîtrisées. C'est le profil d'un paragraphe à 15-17."}
 ]
},
{
 id:"s11", num:11, date:"2026-08-25", jour:"mardi 25 août 2026",
 titre:"Vocabulaire de précision et reformulation",
 themes:"précision lexicale · faux-amis · prépositions verbales · reformuler sans paraphraser · thème court · Amérique latine",
 retenir:[
   "<b>Précision lexicale — trois réflexes qui rapportent immédiatement.</b> (1) Le faux-ami <b>largo</b> ne signifie <b>jamais</b> « large » : il veut dire <i>long</i>. « large » se dit <b>ancho</b> (largeur physique) ou <b>amplio / extenso</b> (sens figuré : <i>un amplio debate</i>). Même famille de pièges : <i>el éxito</i> = le succès, <i>el suceso</i> = le fait divers, <i>sensato</i> = sensé. (2) Les mots passe-partout coûtent des points : <s>cosa</s>, <s>muy grande</s>, <s>importantísimo</s> relèvent de l'oral. Écris <b>un reto</b>, <b>un desafío</b>, <b>de primer orden</b>, <b>decisivo</b>. (3) Mais ne remplace que lorsque c'est naturel : une phrase simple et juste vaut mieux qu'une phrase rare et fausse.",
   "<b>Les prépositions verbales sont une série à automatiser</b>, parce que le français n'aide pas : <b>depender DE</b> · <b>basarse EN</b> · <b>contar CON</b> · <b>consistir EN</b> · <b>insistir EN</b> · <b>cifrar EN</b> · <b>carecer DE</b> · <b>disponer DE</b> · <b>renunciar A</b> · <b>entrar EN vigor</b> (sans article). Les deux pièges les plus fréquents : « compter sur » → <i>contar <b>con</b></i>, et « se baser sur » → <i>basarse <b>en</b></i>. Et n'oublie pas la contraction : <i>depender <b>del</b> mercado</i>.",
   "<b>Reformuler n'est pas paraphraser</b> — c'est le reproche n°1 des rapports de jury sur le résumé analytique. Paraphraser : garder la structure et remplacer quelques mots par des synonymes. Reformuler : <b>changer le niveau d'abstraction</b> (<i>salmón, fruta y vino</i> → <i>las exportaciones agroalimentarias</i>), <b>changer la construction</b> (nominalisation, subordination, voix), et <b>regrouper</b> ce que le texte énumère. Test simple : si tu peux superposer ta phrase et l'originale mot à mot, tu as paraphrasé."
 ],
 immersion:{
   pays:"Colombie", type:"📰 Article",
   sujet:"Le 24 août 2026, lors d'un conseil de sécurité tenu à Barranquilla, le président colombien Abelardo de la Espriella — investi le 7 août 2026, après une victoire très serrée sur Iván Cepeda au second tour du 21 juin — a annoncé que tous les groupes armés illégaux seraient désormais traités comme des organisations terroristes, sans distinction. La décision ferme la porte à toute négociation et rompt explicitement avec la politique de « paz total » de son prédécesseur, Gustavo Petro (2022-2026). Le Gouvernement a par ailleurs ordonné à Migración Colombia des opérations coordonnées d'expulsion d'étrangers en situation irrégulière.",
   pourquoi:"Actualité à très haut rendement, parce qu'elle sert dans au moins quatre dossiers : <b>sécurité et État de droit</b>, <b>limites des processus de paix</b>, <b>migrations intrarégionales</b> (la Colombie est le premier pays d'accueil de la diaspora vénézuélienne) et surtout <b>le virage à droite en Amérique latine</b> — avec Milei en Argentine, Kast au Chili depuis mars 2026, Keiko Fujimori au Pérou depuis juillet 2026 et Rodrigo Paz en Bolivie depuis novembre 2025. C'est exactement le type d'exemple <b>daté et vérifiable</b> qui vaut mieux que dix généralités sur « l'instabilité latino-américaine ». Prudence de méthode : dis « son mouvement », et non « son parti », pour la période de campagne — <i>Defensores de la Patria</i> n'a obtenu sa <i>personería jurídica</i> que le 3 août 2026, quatre jours avant l'investiture.",
   mots:["el giro — le virage, le revirement","los grupos armados ilegales — les groupes armés illégaux","los diálogos de paz — les pourparlers de paix"],
   question:"¿Qué consecuencias políticas y jurídicas tiene el hecho de calificar a todos los grupos armados de « terroristas », y en qué se diferencia esta estrategia de la política de « paz total » del gobierno anterior?",
   url:"https://www.eltiempo.com/justicia/conflicto-y-narcotrafico/presidente-de-la-espriella-ordena-una-sola-linea-contra-el-crimen-y-dice-que-todos-los-grupos-son-terroristas-esto-que-implica-3580616",
   source:"El Tiempo (Bogotá), 24/08/2026. Faits recoupés avec La Nación (Argentine, 24/08/2026) et Infobae Colombia (25/08/2026) pour la nouvelle doctrine de sécurité ; avec El Tiempo (21/06/2026) et CNN en Español (07/08/2026) pour l'élection et l'investiture ; avec Infobae et El Espectador (03/08/2026) pour l'enregistrement du parti. À écarter faute de double source : le pourcentage exact du second tour, ainsi que le bilan chiffré des trois premières semaines de gouvernement (arrestations, saisies) diffusé par une seule source."
 },
 ex:[
  {id:"s11r1",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Los expertos ___ (decir) que la prevención seguía siendo insuficiente.",
   sol:["dijeron"],
   regle:"Première famille des 3<sup>es</sup> personnes irrégulières, revue hier : les <b>radicaux forts en -j-</b> prennent <b>-eron</b>, <b>jamais -ieron</b>. <i>decir → dijeron</i>, <i>traer → trajeron</i>, <i>producir → produjeron</i>, <i>conducir → condujeron</i>, <i>traducir → tradujeron</i>. Le <i>j</i> absorbe le <i>i</i> : <s>dijieron</s> est un barbarisme. Tous les verbes en <b>-ducir</b> suivent ce modèle."},
  {id:"s11r2",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Los alcaldes ___ (pedir) más medios al Gobierno central.",
   sol:["pidieron"],
   regle:"Deuxième famille : les verbes en <b>-ir</b> à alternance vocalique. L'alternance <b>ne touche que les 3<sup>es</sup> personnes</b> de l'indefinido, singulier et pluriel : <i>pidió / pidieron</i>, <i>sintió / sintieron</i>, <i>siguió / siguieron</i>, <i>murió / murieron</i>, et pour le couple o → u : <i>durmió / durmieron</i>. Aux autres personnes, le radical reste intact : <i>pedí, pediste, pedimos, pedisteis</i>. C'est précisément ce décalage que le jury regarde."},
  {id:"s11r3",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Miles de personas ___ (leer) el informe en menos de una semana.",
   sol:["leyeron"],
   regle:"Troisième famille : le <b>i devient y</b> entre deux voyelles. <i>leer → leyó / leyeron</i>, <i>caer → cayó / cayeron</i>, <i>oír → oyó / oyeron</i>, <i>creer → creyó / creyeron</i>, <i>destruir → destruyó / destruyeron</i>, <i>construir → construyeron</i>. Là encore, seules les 3<sup>es</sup> personnes changent — mais attention, les autres personnes portent un accent : <i>leí, leíste, leímos</i>."},
  {id:"s11r4",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>imperfecto de subjuntivo</b>, 3<sup>e</sup> personne du <b>pluriel</b>. Les deux formes sont acceptées.",
   prompt:"El presidente exigió que los ministros ___ (proponer) medidas concretas.",
   sol:["propusieran","propusiesen"],
   regle:"La règle la plus rentable de toute la conjugaison espagnole, revue hier : l'imparfait du subjonctif se fabrique <b>toujours</b> sur la 3<sup>e</sup> personne du pluriel de l'indefinido, sans aucune exception. <i>proponer → propusieron → propusiera / propusiese</i>. Elle élimine d'un coup les barbarismes <s>proponieron</s> et <s>proponieran</s>. Vérifie aussi la <b>concordance</b> : <i>exigió</i> (passé) impose l'imparfait du subjonctif, jamais <s>propongan</s>."},
  {id:"s11r5",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Complète par la <b>préposition</b> qui manque. Un seul mot.",
   prompt:"El Gobierno cifró ___ 262.030 hectáreas la superficie quemada este verano.",
   sol:["en"],
   regle:"<b>cifrar EN</b> — « chiffrer à », « évaluer à ». Même construction : <i>valorar en</i>, <i>estimar en</i>, <i>fijar en</i>. Rappel du chiffre lui-même, vu hier : <b>262.030 hectares</b> et 43 grands incendies au <b>20 août 2026</b>, selon le Gouvernement espagnol. Et note l'écriture espagnole des grands nombres : le <b>point</b> sépare les milliers (262.030), la virgule marque les décimales (3,6 %) — l'inverse de l'anglais. Les années, elles, ne prennent jamais de séparateur : <i>2026</i>, jamais <s>2.026</s>."},
  {id:"s11r6",etape:"RÉACTIVATION",type:"qcm",code:"METH",
   consigne:"Méthode — citer un chiffre en copie. Une seule réponse.",
   prompt:"Dos fuentes serias dan cifras distintas sobre el mismo hecho. ¿Qué conviene hacer en una redacción de concurso?",
   options:["Sumar las dos cifras para dar un total completo","Citar una sola cifra indicando su fuente y su fecha","No citar ninguna cifra, porque las fuentes se contradicen","Citar las dos cifras sin precisar de dónde vienen"],
   sol:1,
   regle:"Réflexe introduit hier, et il vaut pour toute l'année. Deux chiffres différents ne sont pas forcément contradictoires : ils peuvent relever de <b>deux méthodes de mesure</b>. Exemple travaillé : <b>262.030 ha</b> brûlés au 20/08/2026 selon la statistique officielle espagnole, contre <b>296.999 ha</b> au 19/08 selon l'estimation satellitaire européenne EFFIS/Copernicus. Les additionner serait absurde, les opposer serait faux, n'en citer aucun serait un aveu de faiblesse. On en cite <b>un seul, avec sa source et sa date</b> : <i>según el Gobierno español, el 20 de agosto de 2026…</i>"},
  {id:"s11c1",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Vocabulaire de l'économie — traduis en espagnol, <b>article compris</b>.",
   prompt:"les droits de douane",
   sol:["los aranceles","aranceles","los derechos de aduana"],
   regle:"<b>el arancel / los aranceles</b> — c'est le mot que la presse hispanophone emploie systématiquement ; <i>los derechos de aduana</i> existe et se comprend, mais reste administratif. Adjectif : <b>arancelario</b> (<i>una barrera arancelaria</i>, <i>una sobretasa arancelaria</i>). Ne confonds pas la famille : <b>el impuesto</b> = l'impôt · <b>la tasa</b> = la taxe, la redevance · <b>el gravamen</b> = la charge fiscale · <b>la cuota</b> = la cotisation. Application du jour : depuis le <b>25 juillet 2026</b>, les États-Unis appliquent un droit de douane de <b>12,5 %</b> aux importations chiliennes, le cuivre restant exclu.",
   anki:{r:"les droits de douane · une barrière douanière",v:"los aranceles (el arancel) · una barrera arancelaria — ne pas confondre avec el impuesto (impôt) ni la tasa (taxe)",t:"LEX"}},
  {id:"s11c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Traduis en espagnol. <b>Attention au faux-ami.</b>",
   prompt:"un vaste débat",
   sol:["un amplio debate","amplio debate","un extenso debate","extenso debate","un debate amplio","un debate extenso"],
   regle:"Faux-ami majeur : <b>largo</b> signifie <i>long</i>, <b>jamais</b> « large ». <i>Un largo debate</i> = un débat qui dure longtemps. Pour « large » : <b>ancho</b> quand il s'agit d'une largeur physique (<i>una calle ancha</i>), <b>amplio</b> ou <b>extenso</b> au sens figuré (<i>un amplio debate, un amplio consenso, una amplia mayoría</i>). Même série de pièges à connaître par cœur : <b>el éxito</b> = le succès (et non la sortie, <i>la salida</i>) · <b>el suceso</b> = le fait divers, l'événement · <b>sensato</b> = sensé, raisonnable (<i>sensible</i> = sensible) · <b>constipado</b> = enrhumé · <b>la carpeta</b> = le dossier, la chemise."},
  {id:"s11c3",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"GRAM",
   consigne:"Complète par la <b>préposition</b> qui manque. Un seul mot.",
   prompt:"Las exportaciones chilenas dependen ___ las decisiones comerciales de Washington.",
   sol:["de"],
   regle:"<b>depender DE</b>. Ici le français aide — mais pas ailleurs, et c'est bien pour cela qu'il faut apprendre la <b>série entière</b> : <b>depender de</b> · <b>basarse en</b> · <b>contar con</b> · <b>consistir en</b> · <b>insistir en</b> · <b>cifrar en</b> · <b>carecer de</b> · <b>disponer de</b> · <b>renunciar a</b> · <b>entrar en vigor</b>. Les deux fautes les plus fréquentes viennent du calque : « compter <i>sur</i> » → <b>contar con</b>, « se baser <i>sur</i> » → <b>basarse en</b>. Et n'oublie jamais la contraction devant l'article masculin singulier : <i>dependen <b>del</b> mercado</i>, <i>disponen <b>del</b> apoyo</i>.",
   anki:{r:"Prépositions verbales : dépendre de · se baser sur · compter sur · consister en · manquer de",v:"depender DE · basarse EN · contar CON · consistir EN · carecer DE — + entrar EN vigor, cifrar EN, renunciar A. Contraction : del",t:"GRAM"}},
  {id:"s11c4",etape:"TRAVAIL CIBLÉ",type:"qcm",code:"LEX",
   consigne:"Registre écrit de concours — une seule formulation est à la fois correcte <b>et</b> précise.",
   prompt:"Traduire : « C'est un problème majeur pour le pays. »",
   options:["Es una cosa muy importante para el país","Se trata de un reto de primer orden para el país","Es un problema muy grande para el país","Hay un problema importantísimo en el país"],
   sol:1,
   regle:"Les trois autres sont comprises, mais relèvent de l'oral — et le jury les sanctionne comme telles. Le programme de remplacement, à appliquer sans excès : <b>cosa</b> → <i>un aspecto, un elemento, un rasgo, una cuestión</i> · <b>problema</b> → <i>un reto, un desafío, un obstáculo, una traba</i> · <b>importante</b> → <i>de primer orden, de peso, decisivo, clave</i> · <b>hacer</b> → <i>llevar a cabo, emprender, poner en marcha</i> · <b>decir</b> → <i>afirmar, sostener, señalar, subrayar</i> · <b>bueno / malo</b> → <i>acertado, eficaz / nefasto, perjudicial</i>. Le superlatif en <b>-ísimo</b> est expressif, donc oral : évite-le à l'écrit. Règle d'or : on ne remplace que lorsque la formulation reste <b>naturelle</b>."},
  {id:"s11c5",etape:"TRAVAIL CIBLÉ",type:"theme",code:"IDIO",
   consigne:"<b>Thème — une seule phrase.</b> Emploie obligatoirement <b>poner de manifiesto</b>.",
   prompt:"Cette crise met en évidence la fragilité des services publics.",
   sol:"Esta crisis pone de manifiesto la fragilidad de los servicios públicos.",
   regle:"<b>poner de manifiesto</b> = mettre en évidence, faire apparaître. C'est l'une des rares locutions à la fois sobres et vraiment utiles : elle sert dans le résumé comme dans l'essai. Variantes fiables : <b>poner de relieve</b>, <b>evidenciar</b>, <b>revelar</b>, <b>dejar al descubierto</b>, <b>sacar a la luz</b>. Deux vigilances. <b>1.</b> <i>Poner <b>en</b> evidencia <b>a alguien</b></i> ne veut pas dire la même chose : cela signifie mettre quelqu'un dans l'embarras, le démasquer — évite-la pour une idée abstraite. <b>2.</b> <i>Mostrar</i> seul est plat ; réserve-le à un constat neutre. Vocabulaire de la phrase : <b>la fragilidad</b>, <b>los servicios públicos</b>, et n'oublie pas l'article devant le sujet.",
   anki:{r:"mettre en évidence · faire apparaître (une réalité, une faiblesse)",v:"poner de manifiesto · poner de relieve · dejar al descubierto — PAS « poner en evidencia a alguien » (= mettre dans l'embarras)",t:"LEX"}},
  {id:"s11a1",etape:"APPLICATION CONCOURS",type:"qcm",code:"METH",
   consigne:"Résumé analytique — <b>reformuler n'est pas paraphraser</b>. Une seule réponse.",
   prompt:"Original : « El arancel del 12,5 % impuesto por Washington golpea al salmón, la fruta y el vino chilenos, pero deja fuera el cobre. » ¿Cuál de estas frases es una verdadera reformulación?",
   options:["El arancel del 12,5 % impuesto por Washington afecta al salmón, a la fruta y al vino de Chile, pero excluye el cobre","La sobretasa estadounidense penaliza las exportaciones agroalimentarias chilenas y preserva el principal recurso minero del país","Estados Unidos ha impuesto un arancel del 12,5 % que golpea al salmón, la fruta y el vino chilenos, pero no el cobre","Chile sufre un arancel del 12,5 % sobre el salmón, la fruta y el vino, aunque el cobre queda fuera"],
   sol:1,
   regle:"Les options 1, 3 et 4 sont des <b>paraphrases</b> : la structure est conservée, l'énumération recopiée, seuls quelques mots changent (<i>golpea → afecta</i>, <i>deja fuera → excluye / queda fuera</i>). C'est exactement ce que les rapports de jury sanctionnent. La bonne réponse fait trois choses qu'aucune autre ne fait : elle <b>monte d'un cran en abstraction</b> (<i>salmón, fruta y vino</i> → <i>las exportaciones agroalimentarias</i> ; <i>el cobre</i> → <i>el principal recurso minero</i>), elle <b>renverse la logique</b> (<i>penaliza… preserva</i>, deux verbes symétriques, au lieu d'une opposition par <i>pero</i>), et elle <b>regroupe</b> ce que le texte énumérait. Test infaillible : si tu peux superposer ta phrase et l'originale mot à mot, tu as paraphrasé.",
   anki:{r:"Résumé analytique : comment reformuler sans paraphraser ?",v:"Changer le NIVEAU D ABSTRACTION (énumération → catégorie), la CONSTRUCTION (nominaliser, subordonner) et REGROUPER. Test : si les deux phrases se superposent mot à mot, c est une paraphrase.",t:"METH"}},
  {id:"s11a2",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Reformulation — une seule phrase, 20 à 30 mots.</b> Deux contraintes : ne reprends pas plus de <b>deux mots pleins</b> de l'original, et change <b>à la fois</b> le lexique et la construction. Ne donne pas ton avis.",
   prompt:"Reformula en español: « Los terremotos del 24 de junio de 2026 dejaron más de 6.500 muertos en Venezuela y pusieron de manifiesto la fragilidad de las infraestructuras del país. »",
   sol:"La catástrofe sísmica de junio de 2026 costó la vida a más de seis mil quinientas personas y reveló hasta qué punto las redes y los edificios venezolanos estaban mal preparados.",
   regle:"Ce qui vaut la note : <b>1.</b> <i>los terremotos</i> devient <b>la catástrofe sísmica</b> — on nomme la catégorie, pas l'événement brut. <b>2.</b> <i>dejaron más de 6.500 muertos</i> devient <b>costó la vida a más de seis mil quinientas personas</b> : la construction change (le nombre passe en toutes lettres, le verbe devient transitif) et le fait reste exact. <b>3.</b> <i>pusieron de manifiesto la fragilidad de las infraestructuras</i> devient <b>reveló hasta qué punto… estaban mal preparados</b> : on passe d'un groupe nominal à une subordonnée, ce qu'une paraphrase ne fait jamais. <b>4.</b> Aucun avis personnel : dans le résumé analytique, il est interdit. <b>5.</b> Le fait reste vérifiable : environ <b>6.500 morts</b> au 24 août 2026, deux mois après les séismes de magnitude 7,2 et 7,5 du <b>24 juin 2026</b>, l'État côtier de <b>La Guaira</b> étant le plus touché. En copie, cite ce chiffre en le datant. <b>À éviter</b> : le coût total des dégâts, sur lequel les institutions divergent."},
  {id:"s11a3",etape:"APPLICATION CONCOURS",type:"theme",code:"SYN",
   consigne:"<b>Thème — deux phrases.</b> Cinq points de contrôle : les <b>droits de douane</b> · <b>entrar en vigor</b> · un <b>indefinido à la 3<sup>e</sup> personne du pluriel</b> · la préposition de <b>depender</b> avec sa contraction · la <b>concordance des temps</b>.",
   prompt:"Les nouveaux droits de douane sont entrés en vigueur le 25 juillet 2026. Les producteurs chiliens ont dit qu'ils dépendaient trop du marché nord-américain.",
   sol:"Los nuevos aranceles entraron en vigor el 25 de julio de 2026. Los productores chilenos dijeron que dependían demasiado del mercado norteamericano.",
   regle:"Les cinq points, un par un. <b>1.</b> <i>los aranceles</i> — le mot du jour. <b>2.</b> <b>entrar EN vigor</b>, <b>sans article</b> : <s>entrar en el vigor</s> est une faute. <b>3.</b> <i>entraron</i> et <i>dijeron</i> : deux indefinidos à la 3<sup>e</sup> personne du pluriel, dont <i>dijeron</i> — radical fort en <i>-j-</i>, terminaison <b>-eron</b>. <b>4.</b> <b>depender DE</b> + contraction : <i>del mercado</i>, jamais <s>de el mercado</s>. <b>5.</b> La <b>concordance</b> est le vrai piège : <i>dijeron</i> au passé impose l'<b>imparfait</b> dans la subordonnée — <i>dependían</i>, et surtout pas <s>dependen</s>. Deux détails de forme : la date s'écrit <b>el 25 de julio de 2026</b> (deux <i>de</i>, pas de virgule), et <i>demasiado</i> reste <b>invariable</b> quand il est adverbe. Le fait est exact : la surtaxe américaine de 12,5 % sur les importations chiliennes s'applique depuis le 25 juillet 2026."},
  {id:"s11a4",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Condensation — 35 à 45 mots en espagnol.</b> Résume le paragraphe en une ou deux phrases : <b>regroupe</b>, <b>hiérarchise</b>, <b>reformule</b>. Interdits : reprendre les formulations du texte, énumérer dans le même ordre, donner ton opinion.",
   prompt:"El 24 de agosto de 2026, en un consejo de seguridad celebrado en Barranquilla, el presidente colombiano Abelardo de la Espriella anunció que todos los grupos armados ilegales serían tratados como organizaciones terroristas. La medida cierra la puerta a cualquier negociación y rompe con la política de « paz total » de su predecesor, Gustavo Petro. El Gobierno ordenó además a Migración Colombia operaciones coordinadas de expulsión de extranjeros en situación irregular.",
   sol:"Colombia ha dado un giro represivo: desde finales de agosto de 2026, su nuevo presidente equipara a todos los grupos armados con terroristas, renuncia así a la vía negociadora seguida hasta entonces y endurece al mismo tiempo el control migratorio.",
   regle:"Ce qui vaut la note : <b>1.</b> la première proposition <b>nomme le mouvement d'ensemble</b> (<i>un giro represivo</i>) au lieu de commencer par la date et le lieu — hiérarchiser, c'est décider ce qui compte. <b>2.</b> Barranquilla, le nom du prédécesseur et le sigle <i>Migración Colombia</i> <b>disparaissent</b> : ce sont des détails, et un résumé qui garde les détails n'est pas un résumé. <b>3.</b> Les trois informations sont <b>reliées par une logique</b> (<i>equipara… renuncia así a… y endurece al mismo tiempo</i>), pas juxtaposées dans l'ordre du texte. <b>4.</b> Le lexique est <b>entièrement refait</b> : <i>tratados como organizaciones terroristas</i> → <i>equipara con terroristas</i> ; <i>cierra la puerta a cualquier negociación</i> → <i>renuncia a la vía negociadora</i> ; <i>operaciones de expulsión</i> → <i>endurece el control migratorio</i>. <b>5.</b> Aucun jugement : ni « heureusement », ni « autoritaire ». <b>6.</b> 40 mots : la contrainte de longueur est respectée, et c'est une note à part entière au concours.",
   anki:{r:"Colombie — président en exercice depuis août 2026",v:"Abelardo de la Espriella, investi le 7 août 2026 (2e tour du 21 juin, victoire serrée sur Iván Cepeda). Droite. Succède à Gustavo Petro et rompt avec la « paz total »",t:"CIV-AL"}}
 ]
},
{
 id:"s12", num:12, date:"2026-08-26", jour:"mercredi 26 août 2026",
 titre:"Résumé analytique comparatif — le logement en Espagne",
 themes:"résumé comparatif ELVi · confronter deux documents · connecteurs d'opposition · vocabulaire de la vivienda · thème court · Espagne",
 retenir:[
   "<b>Le résumé analytique comparatif n'est pas deux résumés mis bout à bout.</b> Quatre règles qui font la note. <b>1.</b> On répond à la <b>question posée</b> — on n'invente jamais une problématique quand l'énoncé en pose déjà une. <b>2.</b> On construit <b>deux ou trois axes</b>, et <b>chaque axe croise les deux documents</b> : jamais « documento 1 » puis « documento 2 ». <b>3.</b> On identifie la <b>nature</b> et la <b>tonalité</b> de chaque texte (informatif / valoratif) — c'est souvent là que se loge la vraie divergence. <b>4.</b> <b>Aucune opinion personnelle</b>, et aucune phrase recopiée : on reformule ou on ne dit rien.",
   "<b>La boîte à outils de la confrontation</b>, à automatiser une fois pour toutes. Convergence : <b>ambos textos</b> (sans article) · <b>coincidir EN</b> · <b>compartir el mismo diagnóstico</b> · <b>al igual que</b>. Divergence : <b>mientras que</b> (opposition) · <b>frente a</b> · <b>a diferencia de</b> · <b>en cambio</b> · <b>por su parte</b> · <b>discrepar</b>. Attribution : <b>afirmar, sostener, señalar, subrayar, denunciar, matizar</b> + indicatif. Et le réflexe qui coûte le plus cher quand on l'oublie : une opinion <b>niée</b> appelle le <b>subjonctif</b> — <i>no considera que la ley <b>sea</b> eficaz</i>.",
   "<b>Le dossier « vivienda » est l'un des trois ou quatre sujets les plus probables du concours</b>, et tu peux désormais l'écrire avec des chiffres datés : loyer à <b>15,3 €/m²</b> en juillet 2026, <b>+6,8 %</b> sur un an (idealista) · prix d'achat <b>+12,9 %</b> sur un an au 1<sup>er</sup> trimestre 2026 (INE) · chambre en colocation à <b>425 €/mois</b> au 2<sup>e</sup> trimestre 2026 · un jeune consacre près de <b>98,7 %</b> de son salaire moyen à un logement entier, et s'émancipe à <b>30,2 ans</b> (Consejo de la Juventud, mai 2026) · parc social <b>à peine 2-3 %</b> du total, contre environ 8 % dans l'UE. Un chiffre daté et sourcé vaut dix adjectifs."
 ],
 immersion:{
   pays:"Espagne", type:"📰 Article",
   sujet:"Le 25 août 2026, le ministre espagnol des Droits sociaux, de la Consommation et de l'Agenda 2030, Pablo Bustinduy, a présenté au rapporteur spécial de l'ONU sur le droit au logement les grandes lignes d'un futur <i>real decreto</i> : prorogation des contrats de location, encadrement des locations de saison et à la chambre, et hausse de la TVA sur les logements touristiques. Détail qui vaut la peine d'être retenu : ce rapporteur de l'ONU est un Espagnol, <b>Koldo Casla</b>, nommé en mars 2026, qui défend le logement comme <i>un recurso público</i>, au même titre que la santé et l'éducation.",
   pourquoi:"C'est un article à très haut rendement parce qu'il croise en un seul texte <b>trois</b> dossiers de concours : le <b>logement</b>, le <b>tourisme de masse</b> et le <b>rôle des institutions internationales</b>. Il te donne surtout ce qui manque le plus dans les copies : un <b>exemple daté, précis et vérifiable</b> — une mesure, un ministre, une date — là où la moyenne des candidats écrit « le logement est un problème en Espagne ». Repère aussi la construction juridique du texte : <i>real decreto</i>, <i>prórroga</i>, <i>grandes tenedores</i>, <i>zonas tensionadas</i>. Prudence : le décret est un <b>projet</b> au 26 août 2026 ; écris <i>el Gobierno prevé</i> ou <i>ha anunciado</i>, jamais <i>ha aprobado</i>.",
   mots:["la prórroga — la prorogation, la prolongation (d'un contrat)","el relator especial — le rapporteur spécial (faux-ami : ce n'est pas le narrateur)","asequible — abordable, financièrement accessible (≠ accesible, accessible physiquement)"],
   question:"¿Qué medidas concretas prevé el real decreto presentado por Bustinduy, y por qué la vivienda turística ocupa un lugar central en ese proyecto?",
   url:"https://www.idealista.com/news/inmobiliario/vivienda/2026/08/26/911264-bustinduy-avanza-al-relator-de-la-onu-el-real-decreto-sobre-la-prorroga-de",
   source:"idealista/news, 26/08/2026. Faits recoupés avec Pressdigital (25/08/2026) et Cantabria Económica (25/08/2026) pour le contenu du projet de décret ; avec Naiz (31/03/2026) et eldiario.es pour la nomination de Koldo Casla comme rapporteur spécial de l'ONU. À écarter faute de double source concordante : la part exacte du parc social espagnol (1,72 %, 2,5 % ou 3,4 % selon les définitions retenues) et le déficit chiffré de logements."
 },
 ex:[
  {id:"s12r1",etape:"RÉACTIVATION",type:"saisie",code:"LEX",
   consigne:"Traduis en espagnol. <b>Attention au faux-ami revu hier.</b>",
   prompt:"une large majorité",
   sol:["una amplia mayoría","amplia mayoría","una mayoría amplia","mayoría amplia","una gran mayoría","gran mayoría","una extensa mayoría"],
   regle:"<b>largo</b> ne signifie <b>jamais</b> « large » : il veut dire <i>long</i>. Pour « large », deux mots selon le sens. <b>ancho</b> pour une largeur physique : <i>una calle ancha</i>, <i>un río ancho</i>. <b>amplio</b> ou <b>extenso</b> au sens figuré, et ce sont eux qui servent en copie : <i>una amplia mayoría</i>, <i>un amplio consenso</i>, <i>un amplio debate</i>, <i>una amplia gama</i>. <i>Una <b>gran</b> mayoría</i> est également correct et accepté ici. Deuxième passage sur cette faute en deux jours : c'est le signe qu'elle est en cours d'installation, pas encore acquise. La même famille de pièges : <b>el éxito</b> = le succès · <b>el suceso</b> = le fait divers · <b>sensato</b> = sensé · <b>constipado</b> = enrhumé · <b>la carpeta</b> = le dossier."},
  {id:"s12r2",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Complète par la <b>préposition</b> qui manque. Un seul mot.",
   prompt:"El informe del Consejo de la Juventud se basa ___ los datos oficiales del INE.",
   sol:["en"],
   regle:"<b>basarse EN</b> — et non <s>basarse sobre</s>, calque du français « se baser sur ». C'est l'une des deux fautes les plus fréquentes de la série, avec <b>contar CON</b> (« compter sur »). Révise la série entière, testée aujourd'hui sur un autre verbe qu'hier : <b>depender de</b> · <b>basarse en</b> · <b>contar con</b> · <b>consistir en</b> · <b>insistir en</b> · <b>cifrar en</b> · <b>carecer de</b> · <b>disponer de</b> · <b>renunciar a</b> · <b>entrar en vigor</b>. Remarque au passage les deux contractions de la phrase : <i>del Consejo</i>, <i>del INE</i> — <b>de + el</b> donne toujours <b>del</b>."},
  {id:"s12r3",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Más de seis mil personas ___ (morir) en los terremotos de junio de 2026.",
   sol:["murieron"],
   regle:"Deuxième famille des 3<sup>es</sup> personnes, rejouée sur un verbe encore non employé : l'alternance <b>o → u</b>, qui ne touche <b>que</b> la 3<sup>e</sup> personne du singulier et du pluriel. <i>morir → murió / murieron</i> · <i>dormir → durmió / durmieron</i>. Aux autres personnes, le radical reste intact : <i>morí, moriste, morimos</i>. Le fait est exact et daté : le <b>24 juin 2026</b>, deux séismes de magnitude <b>7,2</b> et <b>7,5</b> ont frappé le Venezuela, l'État côtier de <b>La Guaira</b> étant le plus touché ; le bilan s'établit à environ <b>6.500 morts</b> au 24 août 2026. En copie, cite ce chiffre en le datant, et n'utilise pas le coût des dégâts, sur lequel les institutions divergent."},
  {id:"s12r4",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Un seul mot : <b>pretérito indefinido</b>, 3<sup>e</sup> personne du <b>pluriel</b>.",
   prompt:"Los sindicatos ___ (mantener) su rechazo a la reforma del alquiler.",
   sol:["mantuvieron"],
   regle:"Les <b>composés</b> conjuguent exactement comme le verbe simple : c'est la règle qui élimine le plus de barbarismes d'un coup. <i>tener → tuvieron</i>, donc <b>mantener → mantuvieron</b>, <i>obtener → obtuvieron</i>, <i>contener → contuvieron</i>, <i>sostener → sostuvieron</i>. Même logique ailleurs : <i>poner → pusieron</i>, donc <b>proponer → propusieron</b>, <i>suponer → supusieron</i>, <i>imponer → impusieron</i> ; <i>venir → vinieron</i>, donc <b>intervenir → intervinieron</b>. Les formes <s>manteneron</s>, <s>proponieron</s>, <s>intervinieron</s> mal accentuées sont des barbarismes verbaux, sanctionnés comme tels."},
  {id:"s12r5",etape:"RÉACTIVATION",type:"saisie",code:"IDIO",
   consigne:"Complète par la locution qui manque — <b>trois mots</b>.",
   prompt:"El informe ___ ___ ___ la falta de vivienda asequible en las grandes ciudades.",
   sol:["pone de manifiesto"],
   regle:"<b>poner de manifiesto</b> = mettre en évidence, faire apparaître. Revue hier, elle revient aujourd'hui parce qu'elle sert dans les <b>deux</b> exercices du concours : le résumé (<i>el texto pone de manifiesto una contradicción</i>) et l'essai. Variantes fiables : <b>poner de relieve</b>, <b>evidenciar</b>, <b>revelar</b>, <b>dejar al descubierto</b>. Deux vigilances. <b>1.</b> <i>Poner <b>en</b> evidencia <b>a alguien</b></i> signifie tout autre chose : mettre quelqu'un dans l'embarras. <b>2.</b> <i>Mostrar</i> seul est plat. Note aussi le vocabulaire du jour : <b>la vivienda asequible</b>, le logement abordable."},
  {id:"s12r6",etape:"RÉACTIVATION",type:"qcm",code:"CIV",
   consigne:"Civilisation — Amérique latine. Une seule réponse. <b>Se tromper ici en copie serait une erreur éliminatoire.</b>",
   prompt:"¿Quién ejerce la presidencia de Venezuela en agosto de 2026?",
   options:["Nicolás Maduro","Delcy Rodríguez","Edmundo González Urrutia","María Corina Machado"],
   sol:1,
   regle:"<b>Nicolás Maduro n'est plus président du Venezuela.</b> Capturé le <b>3 janvier 2026</b> lors d'une opération des forces spéciales américaines puis transféré à New York, il a été remplacé le <b>5 janvier 2026</b> par <b>Delcy Rodríguez</b>, jusque-là vice-présidente exécutive, qui a prêté serment comme <b><i>presidenta encargada</i></b> et exerce toujours en août 2026. Le Tribunal suprême a forgé pour l'occasion la notion d'<i>ausencia forzosa</i>, afin d'éviter la <i>falta absoluta</i> qui aurait imposé des élections sous trente jours (article 233 de la Constitution). Aucune élection n'a été convoquée. <b>Edmundo González Urrutia</b> est le président que revendique l'opposition depuis 2024, avec <b>María Corina Machado</b> ; ni l'un ni l'autre n'exerce le pouvoir. Écrire « Maduro, président du Venezuela » dans une copie de 2027 te coûterait très cher. Sources : CNN en Español et le ministère vénézuélien des Affaires étrangères, 05/01/2026.",
   anki:{r:"Venezuela — qui exerce la présidence depuis janvier 2026 ?",v:"Delcy Rodríguez, presidenta encargada depuis le 5 janvier 2026, après la capture de Nicolás Maduro le 3 janvier 2026. Aucune élection convoquée. L opposition revendique toujours Edmundo González Urrutia",t:"CIV-AL"}},
  {id:"s12c1",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Vocabulaire du logement — traduis en espagnol, <b>article compris</b>.",
   prompt:"le logement abordable",
   sol:["la vivienda asequible","vivienda asequible"],
   regle:"<b>la vivienda</b> est le mot du dossier : il désigne le logement comme bien et comme <b>politique publique</b> (<i>el derecho a la vivienda</i>, <i>la crisis de la vivienda</i>, <i>la vivienda social</i>, <i>la vivienda protegida</i>). Ne le confonds pas avec <b>el alojamiento</b> (l'hébergement, temporaire), <b>el piso</b> (l'appartement) ni <b>el hogar</b> (le foyer). <b>asequible</b> = abordable, financièrement accessible — faux-ami à ne pas confondre avec <b>accesible</b>, accessible physiquement ou intellectuellement. La formule <i>vivienda asequible</i> est exactement celle qu'emploient la presse et les textes officiels espagnols.",
   anki:{r:"le logement (comme bien et comme politique publique) · le logement abordable",v:"la vivienda · la vivienda asequible — asequible = abordable (prix), à distinguer de accesible (accessible). Aussi : el derecho a la vivienda, la vivienda social",t:"LEX"}},
  {id:"s12c2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Un seul mot : le nom espagnol qui manque.",
   prompt:"El ___ de una habitación en piso compartido alcanzó los 425 euros al mes en el segundo trimestre de 2026.",
   sol:["alquiler","precio","coste"],
   regle:"<b>el alquiler</b> désigne à la fois le <b>loyer</b> et la <b>location</b> : <i>el precio del alquiler</i>, <i>una vivienda de alquiler</i>, <i>el alquiler turístico</i>. Verbe : <b>alquilar</b> (courant) ou <b>arrendar</b> (juridique). Et surtout, ne confonds jamais les deux personnes du contrat : <b>el inquilino</b> (ou <i>el arrendatario</i>) est le <b>locataire</b> ; <b>el casero</b> (ou <i>el arrendador</i>, <i>el propietario</i>) est le <b>bailleur</b>. Un dernier mot, très présent dans la loi espagnole : <b>el gran tenedor</b>, le grand propriétaire bailleur, soumis à des règles particulières. Le chiffre est exact : <b>425 €/mois</b> pour une chambre en colocation au 2<sup>e</sup> trimestre 2026, soit <b>+1 %</b> sur un an, avec Barcelone à 600 €, Madrid et Palma à 550 € (idealista, 24/08/2026).",
   anki:{r:"le loyer / la location · le locataire · le bailleur",v:"el alquiler (alquilar, arrendar) · el inquilino = el arrendatario (locataire) · el casero = el arrendador (bailleur) · el gran tenedor (grand propriétaire bailleur)",t:"LEX"}},
  {id:"s12c3",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"SYN",
   consigne:"Complète par le connecteur d'<b>opposition</b> qui convient — <b>deux mots</b>.",
   prompt:"___ ___ el primer documento se limita a describir la situación, el segundo la denuncia abiertamente.",
   sol:["mientras que"],
   regle:"<b>mientras que</b> marque l'<b>opposition</b> ; <b>mientras</b> seul marque la <b>simultanéité temporelle</b> (<i>mientras leía, tomaba notas</i>). Dans un résumé comparatif, c'est presque toujours <b>mientras que</b> qu'il te faut, et l'oublier fait basculer la phrase dans le contresens. La boîte à outils complète de la confrontation, à automatiser : opposition — <b>mientras que</b>, <b>frente a</b>, <b>a diferencia de</b>, <b>en cambio</b>, <b>por su parte</b>, <b>sin embargo</b> ; convergence — <b>ambos textos</b>, <b>coincidir en</b>, <b>al igual que</b>, <b>compartir el mismo diagnóstico</b>. Note enfin <i>limitarse A</i> + infinitif : encore une préposition verbale.",
   anki:{r:"« tandis que » (opposition) vs « pendant que » (temps)",v:"mientras QUE = opposition (mientras que el primero describe, el segundo denuncia) · mientras seul = simultanéité. Boîte à outils : frente a, a diferencia de, en cambio, por su parte / ambos, coincidir en",t:"GRAM"}},
  {id:"s12c4",etape:"TRAVAIL CIBLÉ",type:"qcm",code:"GRAM",
   consigne:"Mode verbal. Une seule réponse.",
   prompt:"El segundo autor no considera que la ley de 2023 ___ eficaz.",
   options:["es","sea","será","sería"],
   sol:1,
   regle:"Règle décisive pour le résumé analytique, parce qu'elle revient à chaque fois qu'on rapporte une opinion. Un <b>verbe d'opinion à la forme négative</b> appelle le <b>subjonctif</b> : <i>no cree que <b>sea</b></i>, <i>no considera que <b>tenga</b> razón</i>, <i>no piensa que <b>haya</b> funcionado</i>. À la forme <b>affirmative</b>, c'est l'indicatif : <i>considera que <b>es</b> eficaz</i>. Deux voisines à ne pas confondre : <b>no cabe duda de que</b> + <b>indicatif</b> (la négation porte sur le doute, pas sur le fait), et les <b>verbes d'attribution</b> — <i>afirma, sostiene, señala, subraya, denuncia, matiza</i> — qui restent à l'<b>indicatif</b> même au style indirect. Rappel utile en civilisation : la loi visée est la <b>Ley 12/2023, de 24 de mayo, por el derecho a la vivienda</b>, dont l'application dépend des communautés autonomes."},
  {id:"s12c5",etape:"TRAVAIL CIBLÉ",type:"theme",code:"IDIO",
   consigne:"<b>Thème — une seule phrase.</b> Trois points de contrôle : <b>ambos</b> · <b>coincidir en</b> · une opinion <b>niée</b>.",
   prompt:"Les deux auteurs s'accordent sur le diagnostic, mais aucun d'eux ne pense que la loi suffise.",
   sol:"Ambos autores coinciden en el diagnóstico, pero ninguno de ellos cree que la ley baste.",
   regle:"Les trois points, un par un. <b>1.</b> <b>ambos</b> se construit <b>sans article</b> : <i>ambos autores</i>, <i>ambos textos</i> — <s>los ambos autores</s> est une faute. Variante correcte : <i>los dos autores</i>. <b>2.</b> <b>coincidir EN</b> quelque chose (<i>coinciden en el diagnóstico</i>) ; avec quelqu'un, c'est <i>coincidir <b>con</b> alguien <b>en</b> algo</i>. Son contraire est <b>discrepar</b> (<i>discrepan en cuanto a las soluciones</i>). <b>3.</b> <b>ninguno de ellos</b> reste au <b>singulier</b> et entraîne la négation : <i>ninguno de ellos cree</i>. Et la négation portant sur l'opinion impose le <b>subjonctif</b> : <i>que la ley <b>baste</b></i> (de <i>bastar</i>) ou <i>que la ley <b>sea</b> suficiente</i>. Une variante tout aussi juste : <i>pero ninguno considera que la ley resuelva el problema</i>."},
  {id:"s12a1",etape:"APPLICATION CONCOURS",type:"qcm",code:"METH",
   consigne:"Résumé analytique comparatif ELVi — méthode. Une seule réponse.",
   prompt:"El enunciado pregunta: ¿coinciden ambos documentos en el diagnóstico de la crisis? ¿Qué plan responde a lo que espera el jurado?",
   options:["Resumir el documento A, luego el documento B, y concluir","Dos ejes de confrontación, cada uno cruzando los dos documentos","Un eje por documento y, al final, mi opinión personal","Plantear una problemática propia y luego resumir cada texto"],
   sol:1,
   regle:"Le plan « document A puis document B » est le défaut le plus systématiquement sanctionné par les rapports de jury : il produit deux résumés juxtaposés, jamais une comparaison. La bonne méthode est de <b>partir des idées</b>, pas des textes : on dégage <b>deux ou trois axes</b>, et dans <b>chaque</b> axe on fait apparaître ce que disent les deux documents, ce qui les rapproche et ce qui les sépare. Les options 3 et 4 ajoutent deux autres fautes lourdes : l'<b>opinion personnelle</b>, exclue de cet exercice, et l'invention d'une <b>problématique</b> alors que l'énoncé pose déjà la question — il faut y répondre, pas la remplacer. Dernier réflexe : compte tes mots, la contrainte de longueur est notée.",
   anki:{r:"Résumé analytique comparatif ELVi — quel plan adopter ?",v:"2 ou 3 AXES, chacun croisant les DEUX documents. Jamais doc A puis doc B. Répondre à la question posée, ne pas inventer de problématique, aucune opinion personnelle, respecter le nombre de mots",t:"METH"}},
  {id:"s12a2",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Résumé analytique comparatif — 70 à 90 mots en espagnol.</b> Réponds à la question posée. Chaque phrase doit faire travailler <b>les deux</b> documents. Interdits : traiter A puis B, recopier des formulations, donner ton opinion, inventer une problématique.",
   prompt:"<b>Documento A</b> <i>(nota de prensa económica, agosto de 2026)</i> : « El precio del alquiler en España marcó en julio de 2026 un máximo histórico, con 15,3 euros por metro cuadrado y una subida del 6,8 % en un año, según idealista. El precio de compra creció un 12,9 % interanual en el primer trimestre, de acuerdo con el INE. La oferta de habitaciones en pisos compartidos aumentó un 12 %, aunque su precio apenas varió: 425 euros al mes. El paro, en cambio, bajó al 9,87 %, su nivel más bajo desde 2007. »<br><br><b>Documento B</b> <i>(tribuna de opinión, prensa generalista, agosto de 2026)</i> : « Seguimos midiendo la crisis en metros cuadrados y en porcentajes, como si construir más fuera la única salida. El problema no es que falten ladrillos: es que la vivienda ha dejado de ser un techo para convertirse en un activo financiero y en un negocio turístico. Mientras el parque público apenas supera el 2 % del total, muy lejos de la media europea, los jóvenes destinan casi todo su salario al alquiler y se emancipan pasados los treinta años. No es un problema de oferta, sino de prioridades. »<br><br><b>Pregunta : ¿coinciden ambos documentos en el diagnóstico de la crisis de la vivienda en España?</b>",
   sol:"Ambos textos parten de la misma constatación —una vivienda cada vez menos asequible— pero no la explican igual. El primero, de carácter informativo, mide el fenómeno y lo atribuye a la tensión entre una oferta escasa y una demanda sostenida, en un contexto de empleo al alza. El segundo, claramente valorativo, rechaza esa lectura cuantitativa: para su autor, el problema no reside en la falta de construcción, sino en la conversión de la vivienda en activo financiero y en negocio turístico, agravada por un parque público insuficiente.",
   regle:"Compare ta copie à la proposition sur <b>six</b> points, et sois sévère avec toi-même. <b>1. La question est traitée dès la première phrase</b> : <i>parten de la misma constatación… pero no la explican igual</i> — oui sur le constat, non sur les causes. Un résumé qui fait attendre sa réponse perd des points. <b>2. La comparaison est intégrée</b> : chaque phrase fait travailler les deux textes ou les oppose explicitement (<i>El primero… El segundo… rechaza esa lectura</i>). Il n'y a jamais un bloc A suivi d'un bloc B. <b>3. La nature des documents est nommée</b> : <b>informativo</b> contre <b>valorativo</b>. C'est un réflexe ELVi, et c'est souvent là que se loge la divergence réelle. <b>4. Les chiffres disparaissent.</b> Recopier 15,3 €/m², 12,9 % et 9,87 % serait de la paraphrase : on garde l'<b>idée</b> (<i>una vivienda cada vez menos asequible</i>, <i>un contexto de empleo al alza</i>), pas les données. <b>5. Le lexique est refait</b> : <i>ladrillos</i> → <i>construcción</i> ; <i>ha dejado de ser un techo</i> → <i>la conversión de la vivienda en activo financiero</i>. <b>6. Aucune opinion</b> : ni « avec raison », ni « le second a tort ». Vérifie enfin la langue : <i>ambos textos</i> sans article, <b>residir EN</b>, et la structure <b>no… sino</b>, qui est exactement la bonne pour opposer deux causes."},
  {id:"s12a3",etape:"APPLICATION CONCOURS",type:"theme",code:"SYN",
   consigne:"<b>Thème — deux phrases.</b> Cinq points de contrôle : <b>entrar en vigor</b> sans article · un <b>futur</b> · un <b>verbe d'attribution</b> à l'indefinido · la préposition de <b>depender</b> avec sa <b>contraction</b> · la <b>concordance des temps</b>.",
   prompt:"Le nouveau décret entrera en vigueur en janvier 2027. Le ministre a déclaré que le prix des loyers dépendait trop du marché touristique.",
   sol:"El nuevo decreto entrará en vigor en enero de 2027. El ministro declaró que el precio de los alquileres dependía demasiado del mercado turístico.",
   regle:"Les cinq points, un par un. <b>1.</b> <b>entrar EN vigor</b>, <b>sans article</b> : <s>entrar en el vigor</s> est une faute, et c'est le deuxième passage sur ce point. <b>2.</b> Le <b>futur</b> <i>entrará</i> porte un accent écrit — toutes les personnes du futur sont accentuées sauf <i>entraremos</i>. <b>3.</b> <b>declaró</b> (ou <i>afirmó</i>, <i>sostuvo</i>, <i>señaló</i>) : verbe d'attribution à l'indefinido, 3<sup>e</sup> personne du singulier, accent sur la dernière syllabe. <b>4.</b> <b>depender DE</b> + <b>contraction</b> : <i>del mercado</i>, jamais <s>de el mercado</s>. <b>5.</b> La <b>concordance</b> est le vrai piège : <i>declaró</i> au passé impose l'<b>imparfait</b> dans la subordonnée — <i>dependía</i>, et surtout pas <s>depende</s>. Deux détails de forme : <i>en enero de 2027</i> (et non <s>en enero 2027</s>), et <i>demasiado</i> reste <b>invariable</b> quand il est adverbe. Honnêteté sur le fait : un <i>real decreto</i> sur la prorogation des loyers et les logements touristiques a bien été présenté le <b>25 août 2026</b> par le ministre Pablo Bustinduy, mais sa date d'entrée en vigueur n'est pas fixée — janvier 2027 est une hypothèse d'exercice, à ne pas réemployer comme un fait."},
  {id:"s12a4",etape:"APPLICATION CONCOURS",type:"libre",code:"METH",
   consigne:"<b>Reformulation — une seule phrase, 20 à 30 mots.</b> Ne reprends pas plus de <b>deux mots pleins</b> de l'original. Change <b>à la fois</b> le lexique et la construction. Pas d'opinion.",
   prompt:"Reformula en español: « Los jóvenes españoles destinan casi todo su salario al alquiler y se emancipan, de media, pasados los treinta años. »",
   sol:"El coste del arrendamiento absorbe la práctica totalidad de los ingresos juveniles, lo que retrasa hasta la treintena la salida del domicilio familiar.",
   regle:"Ce qui vaut la note, en quatre gestes. <b>1. Changer le sujet grammatical</b> : la phrase originale part des jeunes, la reformulation part du <b>coût</b> (<i>el coste del arrendamiento absorbe…</i>). Déplacer le sujet est le moyen le plus sûr d'échapper à la paraphrase. <b>2. Monter d'un cran en abstraction</b> : <i>casi todo su salario</i> → <i>la práctica totalidad de los ingresos juveniles</i> ; <i>el alquiler</i> → <i>el arrendamiento</i> ; <i>a los treinta años</i> → <i>la treintena</i>. <b>3. Créer un lien logique absent de l'original</b> : <i><b>lo que</b> retrasa…</i> transforme une simple juxtaposition en rapport de cause à effet. C'est exactement ce qu'une paraphrase ne fait jamais. <b>4. Le vocabulaire de l'émancipation</b>, déjà croisé : <b>independizarse</b>, <b>emanciparse</b>, <b>la salida del domicilio familiar</b>, <b>la edad de emancipación</b>. Les données réelles, pour ta copie : âge moyen d'émancipation <b>30,2 ans</b>, taux d'émancipation <b>14,5 %</b>, et un logement entier absorbe <b>98,7 %</b> du salaire moyen d'un jeune (Consejo de la Juventud de España, mai 2026)."}
 ]
},
{
 id:"s13", num:13, date:"2026-08-27", jour:"jeudi 27 août 2026",
 titre:"Essai argumenté — la crise du logement en Espagne",
 themes:"essai argumenté ELVi · prise de position · aunque + indicatif/subjonctif · de ahí que + subjonctif · carecer de · thème court · Espagne",
 retenir:[
   "<b>L'essai n'est pas une seconde synthèse du dossier.</b> Quatre gestes qui font la note. <b>1.</b> On <b>répond dès la première phrase</b> : <i>No, la regulación es necesaria pero insuficiente…</i> — pas d'introduction scolaire, pas de fausse problématique. <b>2.</b> On <b>prend position</b> et on l'assume jusqu'au bout. <b>3.</b> On <b>nuance vraiment</b> (<i>Ahora bien…</i>), ce qui n'est pas se dédire mais reconnaître la force de l'objection. <b>4.</b> Chaque argument s'appuie sur un <b>exemple daté et vérifiable</b> : une loi, une date, un chiffre. Une copie qui affirme sans exemple plafonne à 10 ; une copie qui donne un exemple précis par argument monte à 15.",
   "<b>Les deux structures qui font gagner des points dans un essai.</b> <b>aunque</b> + <b>indicatif</b> quand le fait est <b>avéré et admis</b> — <i>aunque la ley <b>está</b> en vigor, se aplica poco</i> ; <b>aunque</b> + <b>subjonctif</b> quand on concède une <b>hypothèse</b> — <i>aunque la ley <b>fuera</b> perfecta, no bastaría</i>. Et pour la conséquence : <b>de ahí que</b> + <b>subjonctif</b>, toujours — <i>de ahí que muchos jóvenes <b>sigan</b> en casa de sus padres</i>. Ajoute <b>carecer DE</b> / <b>disponer DE</b> : <i>España <b>carece de</b> un parque público suficiente</i>.",
   "<b>Le dossier de la vivienda, en trois faits sûrs et datés.</b> <b>1.</b> Loyer moyen <b>15,3 €/m²</b> en juillet 2026, <b>+6,8 %</b> sur un an, record de la série <i>idealista</i>. <b>2.</b> La <b>Ley 12/2023, de 24 de mayo, por el derecho a la vivienda</b> autorise les <i>zonas de mercado residencial tensionado</i>, mais l'application dépend des communautés autonomes : au 27 août 2026, <b>cinq seulement</b> en ont déclaré, pour un total de <b>317 municipios</b>, dont la très grande majorité en <b>Catalogne</b>. <b>3.</b> Le décret qui prorogeait les contrats de location a été <b>rejeté par le Congrès le 28 avril 2026</b>. Retiens l'articulation : la loi existe, mais l'État ne l'applique pas seul et le Parlement bloque."
 ],

 ex:[
  {id:"s13r1",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Complète avec la locution d'<b>opposition</b> attendue — <b>deux mots</b>.",
   prompt:"Cataluña ha declarado cientos de zonas tensionadas, ___ Madrid no ha declarado ninguna.",
   sol:["mientras que"],
   regle:"<b>mientras que</b> marque l'<b>opposition</b> entre deux réalités : <i>Cataluña las ha declarado, <b>mientras que</b> Madrid no</i>. <b>mientras</b> seul marque la <b>simultanéité</b> dans le temps : <i><b>mientras</b> el Gobierno negociaba, los precios seguían subiendo</i>. La confusion est fréquente et se voit immédiatement en copie. Autres outils d'opposition, tous utilisables dans un essai : <b>en cambio</b>, <b>por su parte</b>, <b>a diferencia de</b>, <b>frente a</b>. Et le fait, vérifié : au 27 août 2026, <b>cinq</b> communautés autonomes seulement ont déclaré des <i>zonas tensionadas</i> — Catalogne, Pays basque, Navarre, Galice, Asturies — pour <b>317 municipios</b> au total, dont la très grande majorité en Catalogne. Madrid n'en a déclaré aucune."},
  {id:"s13r2",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Traduis en espagnol. <b>Deux points de contrôle</b> revus hier : le déterminant de « les deux », et la préposition du verbe.",
   prompt:"Les deux ministres sont d'accord sur le diagnostic.",
   sol:["Ambos ministros coinciden en el diagnóstico.","Los dos ministros coinciden en el diagnóstico.","Ambos ministros están de acuerdo en el diagnóstico.","Los dos ministros están de acuerdo en el diagnóstico."],
   regle:"<b>1.</b> <b>ambos</b> se construit <b>sans article</b> : <i>ambos ministros</i>, jamais <s>los ambos ministros</s>. La variante <i>los dos ministros</i> est également correcte. <b>2.</b> <b>coincidir EN</b> quelque chose — <i>coinciden <b>en</b> el diagnóstico</i> ; avec quelqu'un : <i>coincidir <b>con</b> alguien <b>en</b> algo</i>. Même préposition pour <i>estar de acuerdo <b>en</b></i>. Son contraire, revu la semaine dernière, est <b>discrepar DE</b>. Ces deux verbes sont les charnières de tout résumé comparatif et de tout essai nuancé : automatise-les."},
  {id:"s13r3",etape:"RÉACTIVATION",type:"saisie",code:"GRAM",
   consigne:"Conjugue le verbe entre parenthèses au temps et au mode qui conviennent.",
   prompt:"No creo que esta medida ___ (resolver) el problema de la vivienda.",
   sol:["resuelva"],
   regle:"Règle à automatiser une fois pour toutes : un verbe d'opinion <b>nié</b> entraîne le <b>subjonctif</b> dans la subordonnée. <i>Creo que <b>resuelve</b></i> (indicatif) mais <i>No creo que <b>resuelva</b></i> (subjonctif). Même mécanique avec <i>no pienso que</i>, <i>no considero que</i>, <i>no me parece que</i>. Attention à la <b>diphtongue</b> : <i>resolver</i> est un verbe en <b>o → ue</b> — <i>resuelva, resuelvas, resuelva, resolvamos, resolváis, resuelvan</i> — la diphtongue tombe aux deux premières personnes du pluriel, jamais ailleurs. Et n'oublie pas la contrepartie : <b>no cabe duda de que</b> et <b>es evidente que</b>, eux, appellent l'<b>indicatif</b>."},
  {id:"s13r4",etape:"RÉACTIVATION",type:"saisie",code:"CONJ",
   consigne:"Conjugue. <b>Rappelle-toi la règle des composés</b> vue lundi.",
   prompt:"intervenir — pretérito indefinido — ellos",
   sol:["intervinieron"],
   regle:"Un verbe composé se conjugue <b>comme son verbe simple</b>. <i>venir → <b>vinieron</b></i>, donc <i>intervenir → <b>intervinieron</b></i>, <i>convenir → <b>convinieron</b></i>, <i>prevenir → <b>previnieron</b></i>. La même logique gouverne toute une famille que le jury voit échouer chaque année : <i>tener → tuvieron</i>, donc <b>obtuvieron</b>, <b>sostuvieron</b>, <b>mantuvieron</b>, <b>detuvieron</b> ; <i>poner → pusieron</i>, donc <b>propusieron</b>, <b>impusieron</b>, <b>supusieron</b>. Le barbarisme <s>intervenieron</s>, calqué sur l'infinitif, est immédiatement sanctionné. Note aussi qu'aucune de ces formes ne porte d'accent écrit à l'indefinido irrégulier : <i>tuvo</i>, <i>puso</i>, <i>vino</i>, jamais <s>tuvó</s>."},
  {id:"s13r5",etape:"RÉACTIVATION",type:"qcm",code:"LEX",
   consigne:"Une seule réponse. <b>Le faux-ami revu hier.</b>",
   prompt:"« Un logement abordable », en español, se dice:",
   options:["una vivienda accesible","una vivienda asequible","una vivienda alcanzable","una vivienda barata"],
   sol:1,
   regle:"<b>asequible</b> = <b>abordable financièrement</b>, dont on peut payer le prix. <b>accesible</b> = <b>accessible physiquement</b> (un lieu, un bâtiment) ou, au figuré, une personne facile d'accès. Écrire <i>una vivienda accesible</i> pour parler du prix est une faute lexicale que le jury relève systématiquement. <i>Barata</i> n'est pas faux mais dit autre chose : « bon marché », avec une nuance de qualité médiocre, alors qu'<i>asequible</i> est le mot du débat public espagnol — <i>vivienda asequible</i>, <i>alquiler asequible</i>. Retiens la formule prête à l'emploi : <b>el acceso a una vivienda asequible</b>, « l'accès à un logement abordable »."},
  {id:"s13r6",etape:"RÉACTIVATION",type:"qcm",code:"CIV",
   consigne:"Civilisation — une seule réponse. <b>Point à ne surtout pas rater au concours.</b>",
   prompt:"¿Quién está al frente del Estado venezolano en agosto de 2026?",
   options:["Nicolás Maduro","Delcy Rodríguez","Edmundo González Urrutia","María Corina Machado"],
   sol:1,
   regle:"<b>Delcy Rodríguez</b>, jusqu'alors vice-présidente exécutive, a prêté serment le <b>5 janvier 2026</b> et exerce toujours le pouvoir en août 2026. <b>Nicolás Maduro a été capturé le 3 janvier 2026</b> par les forces spéciales américaines et est <b>détenu aux États-Unis</b> dans l'attente de son procès, fixé au <b>1<sup>er</sup> juin 2027</b>. Nuance de vocabulaire qui compte : le chavisme la présentait comme <i>presidenta <b>encargada</b></i>, mais a cessé de le faire depuis l'été 2026, le délai constitutionnel étant expiré. En copie, écris <i>presidenta de facto</i> ou <i>al frente del Estado</i> — <b>jamais</b> <i>presidenta electa</i>. Écrire « Maduro, président du Venezuela » en 2027 serait une <b>erreur éliminatoire</b>."},
  {id:"s13t1",etape:"TRAVAIL CIBLÉ",type:"qcm",code:"GRAM",
   consigne:"Une seule réponse. Le fait est <b>avéré</b> : la loi <b>existe bel et bien</b>.",
   prompt:"« Bien que la loi soit en vigueur depuis 2023, elle s'applique peu. »",
   options:["Aunque la ley esté en vigor desde 2023, se aplica poco","Aunque la ley está en vigor desde 2023, se aplica poco","Aunque la ley estuviera en vigor desde 2023, se aplica poco","Aunque la ley estará en vigor desde 2023, se aplica poco"],
   sol:1,
   regle:"C'est le point où le français induit en erreur : « bien que » impose le subjonctif en français, <b>pas</b> en espagnol. <b>aunque + INDICATIF</b> quand le fait est <b>réel et admis par les deux interlocuteurs</b> : <i>aunque la ley <b>está</b> en vigor</i> — elle l'est, personne n'en doute. <b>aunque + SUBJONCTIF</b> dans deux cas seulement : l'information est <b>hypothétique</b> (<i>aunque la ley <b>fuera</b> perfecta, no bastaría</i>) ou elle est <b>déjà connue</b> et présentée comme une concession sans enjeu (<i>aunque <b>sea</b> difícil, hay que intentarlo</i>). Dans un essai, c'est le premier cas qui domine : tu concèdes un fait vérifié, donc <b>indicatif</b>. Deux autres formes à surveiller : <i>desde 2023</i> se construit avec un <b>présent</b> pour un état qui dure, et <b>estar en vigor</b> — pas <s>ser en vigor</s>.",
   anki:{r:"aunque : indicatif ou subjonctif ?",v:"+ INDICATIF si le fait est réel et admis (aunque la ley ESTÁ en vigor, se aplica poco) · + SUBJONCTIF si c'est une hypothèse (aunque FUERA perfecta, no bastaría). « Bien que » français ≠ aunque espagnol",t:"GRAM"}},
  {id:"s13t2",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"GRAM",
   consigne:"Conjugue le verbe entre parenthèses. <b>La locution impose le mode.</b>",
   prompt:"El alquiler ha alcanzado un máximo histórico; de ahí que muchos jóvenes ___ (seguir) viviendo con sus padres.",
   sol:["sigan"],
   regle:"<b>de ahí que</b> introduit une <b>conséquence</b> et exige <b>toujours le subjonctif</b>, sans exception : <i>de ahí que <b>sigan</b></i>, <i>de ahí que <b>haya</b> aumentado</i>, <i>de ahí que el Gobierno <b>quiera</b> intervenir</i>. C'est une locution de très bon rapport en essai : elle relie deux idées et signale au correcteur que tu construis un raisonnement, pas une liste. Attention à la conjugaison : <b>seguir</b> est un verbe en <b>e → i</b> — <i>siga, sigas, siga, sigamos, sigáis, <b>sigan</b></i> — et la <b>u</b> de l'infinitif disparaît au subjonctif. Rappel de construction : <b>seguir + gérondif</b> = « continuer à » (<i>siguen viviendo</i>) ; ne dis jamais <s>seguir a vivir</s>.",
   anki:{r:"de ahí que + quel mode ?",v:"TOUJOURS le subjonctif — de ahí que muchos jóvenes SIGAN viviendo con sus padres (conséquence). Jamais l'indicatif",t:"GRAM"}},
  {id:"s13t3",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"GRAM",
   consigne:"Complète : le verbe au <b>présent</b> et <b>sa préposition</b> — <b>deux mots</b>.",
   prompt:"España ___ un parque público de vivienda comparable al de sus vecinos europeos. <i>(carecer)</i>",
   sol:["carece de"],
   regle:"<b>carecer DE</b> = « manquer de », « être dépourvu de ». C'est un verbe de registre écrit, exactement celui qu'un essai attend à la place du banal <i>no tener</i>. Sa conjugaison suit celle des verbes en <b>-cer</b> : <i>carezco, careces, <b>carece</b>, carecemos, carecéis, carecen</i>. Il appartient à la série des <b>prépositions verbales</b> que tu dois connaître par cœur, parce qu'une préposition fausse est une faute pleine : <b>carecer de</b> · <b>disponer de</b> · <b>depender de</b> · <b>basarse en</b> · <b>consistir en</b> · <b>contar con</b> · <b>coincidir en</b> · <b>discrepar de</b>. Retiens la phrase entière, elle est réutilisable telle quelle en copie : <i>España <b>carece de</b> un parque público de vivienda comparable al europeo</i>."},
  {id:"s13t4",etape:"TRAVAIL CIBLÉ",type:"saisie",code:"LEX",
   consigne:"Traduis l'expression. C'est le mot-clé du dossier.",
   prompt:"le parc public de logements",
   sol:["el parque público de vivienda","el parque público de viviendas","el parque residencial público","el parque de vivienda pública","el parque público"],
   regle:"<b>el parque público de vivienda</b> (ou <i>de viviendas</i>) est la formule employée par la presse et les institutions espagnoles ; <i>el parque residencial público</i> est une variante correcte. En espagnol, <b>parque</b> a ce sens de « parc » au sens d'ensemble d'équipements — comme <i>el parque automovilístico</i>. Le champ lexical complet, à avoir en tête pour l'essai : <b>la vivienda social</b> (le logement social) · <b>la vivienda protegida</b> (VPO, logement à prix encadré) · <b>el alquiler asequible</b> · <b>el gran tenedor</b> (le grand propriétaire, au sens de la Ley 12/2023 : plus de dix biens résidentiels) · <b>el inquilino</b> (le locataire) face à <b>el casero</b> ou <b>el arrendador</b> (le bailleur) · <b>la escasez de oferta</b> (la pénurie d'offre)."},
  {id:"s13t5",etape:"TRAVAIL CIBLÉ",type:"theme",code:"SYN",
   consigne:"<b>Thème — une phrase.</b> Trois points de contrôle : « il faudrait que » suivi de la <b>concordance</b>, la traduction de « sinon », et le <b>futur</b>.",
   prompt:"Il faudrait que le gouvernement construise davantage de logements sociaux ; sinon, le problème s'aggravera.",
